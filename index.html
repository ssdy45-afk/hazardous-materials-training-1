<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>위험물 안전관리 교육 포털 - 한국피셔과학(주) 인천 ICDC</title>
  <meta name="description" content="한국피셔과학(주) 인천 ICDC 위험물 옥내저장소 예방규정 및 36개 실무 교육 포털">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@700&family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
/* ==================== THERMO FISHER SCIENTIFIC PORTAL THEME (EXACT MATCH TO SCREENSHOT) ==================== */
@import "tailwindcss";

:root {
  --ink: #0f172a;
  --ink-2: #334155;
  --bg: #f8fafc;
  --white: #ffffff;
  --line: #e2e8f0;
  --orange: #ea580c;
  --orange-dark: #c2410c;
  --lime: #16a34a;
  --muted: #64748b;
  --tf-red: #cc0000;
  --navy: #0f2335;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }

/* ==================== PORTAL HERO (MATCHING SCREENSHOT) ==================== */
.portal-hero {
  background: #ffffff;
  padding: 56px clamp(20px, 5vw, 64px) 40px;
  text-align: center;
  border-bottom: 1px solid var(--line);
}

.tf-logo-area {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 24px;
}

.tf-logo-area img {
  height: 48px;
  object-fit: contain;
  max-width: 90%;
}

.portal-title {
  font-size: clamp(30px, 3.6vw, 44px);
  font-weight: 900;
  color: var(--tf-red);
  margin: 0 0 14px;
  letter-spacing: -0.03em;
}

.portal-sub {
  font-size: clamp(14.5px, 1.35vw, 16.5px);
  color: #475569;
  max-width: 840px;
  margin: 0 auto;
  line-height: 1.65;
  font-weight: 500;
}

/* ==================== MAIN CONTAINER ==================== */
.portal-container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 32px clamp(16px, 4vw, 40px) 96px;
}

/* ==================== 3 INFO BADGES ==================== */
.info-badges-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}

.info-badge-card {
  background: #ffffff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 22px 26px;
  box-shadow: 0 2px 8px rgba(0,0,0,.03);
  display: flex;
  flex-direction: column;
  gap: 6px;
  text-align: left;
}

.info-badge-card small {
  font-size: 12.5px;
  color: #64748b;
  font-weight: 600;
}

.info-badge-card strong {
  font-size: 16.5px;
  color: #0f172a;
  font-weight: 800;
}

/* ==================== ICDC REGULATION BOX ==================== */
.regulation-box {
  background: #ffffff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 30px 34px;
  box-shadow: 0 2px 8px rgba(0,0,0,.03);
  margin-bottom: 32px;
}

.regulation-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

.regulation-head h3 {
  margin: 0;
  font-size: 20px;
  font-weight: 900;
  color: #0f172a;
}

.regulation-head p {
  margin: 4px 0 0;
  font-size: 14px;
  color: #475569;
}

.reg-link-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 18px;
  border: 1.5px solid #cbd5e1;
  background: #ffffff;
  color: #0f172a;
  font-size: 13.5px;
  font-weight: 700;
  border-radius: 8px;
  transition: all .15s ease;
}

.reg-link-btn:hover {
  border-color: var(--tf-red);
  color: var(--tf-red);
  background: #fff5f5;
}

.reg-fields-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 16px;
}

.reg-field-item {
  background: #f8fafc;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 15px 20px;
}

.reg-field-item small {
  display: block;
  font-size: 11.5px;
  color: #64748b;
  margin-bottom: 4px;
  font-weight: 700;
}

.reg-field-item strong {
  font-size: 15.5px;
  color: #0f172a;
  font-weight: 800;
}

.reg-note-text {
  margin: 0;
  font-size: 12.5px;
  line-height: 1.65;
  color: #64748b;
  border-top: 1px solid #f1f5f9;
  padding-top: 16px;
}

/* ==================== ADMIN PREVIEW BANNER ==================== */
.admin-banner {
  background: var(--navy);
  border-radius: 12px;
  padding: 22px 30px;
  color: #ffffff;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 36px;
  box-shadow: 0 4px 16px rgba(15,35,53,.15);
  flex-wrap: wrap;
}

.admin-banner-left h4 {
  margin: 0 0 4px;
  font-size: 17.5px;
  font-weight: 900;
}

.admin-banner-left p {
  margin: 0;
  font-size: 13.5px;
  color: #94a3b8;
}

.admin-banner-left .status-text {
  margin-top: 6px;
  font-size: 13px;
  color: #38bdf8;
  font-weight: 700;
}

.admin-banner-right {
  display: flex;
  align-items: center;
  gap: 14px;
}

.admin-action-btn {
  padding: 9px 20px;
  background: #ffffff;
  color: var(--navy);
  font-size: 13.5px;
  font-weight: 800;
  border-radius: 8px;
  border: 0;
  cursor: pointer;
  transition: all .15s ease;
}

.admin-action-btn:hover {
  background: #f1f5f9;
  transform: translateY(-1px);
}

.admin-active-badge {
  font-size: 13.5px;
  color: #facc15;
  font-weight: 800;
}

/* ==================== SECTION TITLE & TRACK FILTER ==================== */
.section-kicker {
  font-size: 12px;
  font-weight: 900;
  color: var(--tf-red);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.section-main-title {
  font-size: 26px;
  font-weight: 900;
  color: #0f172a;
  margin: 0 0 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
}

.track-filter-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 28px;
}

.track-chip {
  padding: 8px 18px;
  border: 1px solid #cbd5e1;
  background: #ffffff;
  color: #334155;
  font-size: 13.5px;
  font-weight: 700;
  border-radius: 20px;
  cursor: pointer;
  transition: all .15s ease;
}

.track-chip:hover {
  border-color: #0f172a;
  color: #0f172a;
}

.track-chip.active {
  background: #0f172a;
  color: #ffffff;
  border-color: #0f172a;
  box-shadow: 0 2px 8px rgba(15,23,42,.2);
}

/* ==================== 3-COLUMN COURSE CARDS (CLEAN WHITE) ==================== */
.course-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
  gap: 22px;
}

.clean-course-card {
  background: #ffffff;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 26px;
  box-shadow: 0 2px 10px rgba(0,0,0,.03);
  display: flex;
  flex-direction: column;
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  cursor: pointer;
  position: relative;
}

.clean-course-card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 28px rgba(0,0,0,.08);
  border-color: #cbd5e1;
}

.clean-course-card.is-locked {
  background: #f8fafc;
  opacity: .88;
}

.clean-course-card.is-done {
  border-color: #86efac;
  background: #fcfdfc;
}

.course-card-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}

.course-badge-pill {
  display: inline-block;
  padding: 5px 13px;
  border-radius: 20px;
  font-size: 12.5px;
  font-weight: 800;
  letter-spacing: .02em;
}

.badge-yellow { background: #fef9c3; color: #854d0e; }
.badge-green { background: #dcfce7; color: #166534; }
.badge-purple { background: #f3e8ff; color: #6b21a8; }
.badge-blue { background: #dbeafe; color: #1e40af; }
.badge-red { background: #fee2e2; color: #991b1b; }
.badge-orange { background: #ffedd5; color: #9a3412; }

.status-badge {
  font-size: 11.5px;
  font-weight: 800;
  padding: 4px 10px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.status-badge.lock { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; }
.status-badge.done { background: #dcfce7; border: 1px solid #86efac; color: #166534; }
.status-badge.open { background: #e0f2fe; color: #0369a1; }

.clean-course-card h3 {
  margin: 0 0 10px;
  font-size: 20px;
  font-weight: 800;
  color: #0f172a;
  line-height: 1.4;
}

.clean-course-card p {
  margin: 0 0 20px;
  font-size: 14px;
  color: #64748b;
  line-height: 1.65;
  flex: 1;
}

.course-card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 18px;
  border-top: 1px solid #f1f5f9;
  gap: 10px;
}

.course-meta-tags {
  display: flex;
  gap: 12px;
  font-size: 12.5px;
  color: #64748b;
  font-weight: 600;
}

.course-action-btn {
  padding: 9px 18px;
  background: var(--navy);
  color: #ffffff;
  font-size: 13.5px;
  font-weight: 800;
  border-radius: 8px;
  border: 0;
  cursor: pointer;
  transition: all .15s ease;
  white-space: nowrap;
}

.course-action-btn:hover {
  background: var(--orange);
}

.course-action-btn.locked {
  background: #cbd5e1;
  color: #475569;
}

/* ==================== DEDICATED FULLSCREEN COURSE VIEW ==================== */
.course-view-page {
  background: #f8fafc;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.course-nav-bar {
  height: 68px;
  padding: 0 clamp(20px, 4vw, 48px);
  background: var(--navy);
  color: #ffffff;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 50;
  border-bottom: 3px solid var(--tf-red);
}

.back-home-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  background: rgba(255,255,255,.12);
  border: 1px solid rgba(255,255,255,.2);
  color: #ffffff;
  font-size: 13.5px;
  font-weight: 800;
  border-radius: 6px;
  cursor: pointer;
  transition: all .15s ease;
}

.back-home-btn:hover {
  background: var(--tf-red);
  border-color: var(--tf-red);
}

.course-top-title {
  display: flex;
  align-items: center;
  gap: 12px;
}

.course-top-title h2 {
  margin: 0;
  font-size: 18px;
  font-weight: 800;
  color: #ffffff;
}

/* Stepper Tabs */
.course-stepper-bar {
  display: flex;
  gap: 8px;
  padding: 12px clamp(20px, 4vw, 48px);
  background: #ffffff;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
  scrollbar-width: thin;
  position: sticky;
  top: 68px;
  z-index: 40;
}

.step-tab-btn {
  padding: 8px 16px;
  border: 1px solid #cbd5e1;
  background: #ffffff;
  color: #475569;
  font-size: 13px;
  font-weight: 800;
  border-radius: 20px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  transition: all .15s ease;
}

.step-tab-btn span.num {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #f1f5f9;
  display: grid;
  place-items: center;
  font-size: 11px;
  color: #0f172a;
  font-weight: 900;
}

.step-tab-btn:hover {
  border-color: #0f172a;
  color: #0f172a;
}

.step-tab-btn.active {
  background: var(--navy);
  color: #ffffff;
  border-color: var(--navy);
  box-shadow: 0 2px 8px rgba(15,35,53,.2);
}

.step-tab-btn.active span.num {
  background: var(--tf-red);
  color: #ffffff;
}

.step-tab-btn.completed {
  border-color: #86efac;
  background: #f0fdf4;
  color: #166534;
}

.step-tab-btn.completed span.num {
  background: #16a34a;
  color: #ffffff;
}

/* Course Main Slide Container */
.course-main-content {
  flex: 1;
  padding: 36px clamp(20px, 4vw, 48px) 140px;
  max-width: 1280px;
  width: 100%;
  margin: 0 auto;
}

.book-slide {
  max-width: 1280px;
  width: 100%;
  margin: 0 auto;
  padding-bottom: 30px;
}

.book-slide.fade-in {
  animation: slidePageIn .25s ease-out;
}

@keyframes slidePageIn {
  from { opacity: 0; transform: translateX(12px); }
  to { opacity: 1; transform: translateX(0); }
}

.book-slide-header { margin-bottom: 28px; border-bottom: 2px solid #0f172a; padding-bottom: 20px; }
.slide-badge { display: inline-block; padding: 6px 14px; background: var(--navy); color: #38bdf8; font-size: 13px; font-weight: 900; letter-spacing: .06em; border-radius: 4px; margin-bottom: 12px; }
.slide-badge.basic-badge { background: #ea580c; color: #ffffff; }
.slide-badge.video-badge { background: #dc2626; color: #ffffff; }
.slide-badge.exam-badge { background: #0369a1; color: #ffffff; }
.video-header-badges { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.video-duration-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; font-size: 13px; font-weight: 900; border-radius: 4px; }
.book-slide-header h2 { margin: 0 0 12px; font-size: clamp(26px, 3vw, 36px); letter-spacing: -.03em; color: #0f172a; line-height: 1.3; font-weight: 900; }
.slide-sub { margin: 0; font-size: 16px; color: #475569; line-height: 1.7; font-weight: 500; }

.objective-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin: 24px 0 32px; }
.objective-card { display: flex; align-items: flex-start; gap: 16px; padding: 22px 24px; background: #ffffff; border: 1px solid var(--line); border-left: 6px solid #ea580c; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.03); }
.obj-num { width: 36px; height: 36px; background: var(--navy); color: #38bdf8; font-weight: 900; font-size: 16px; display: grid; place-items: center; border-radius: 50%; flex: 0 0 auto; }
.objective-card p { margin: 0; font-size: 16px; line-height: 1.6; color: #0f172a; font-weight: 700; }

.core-slide-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 24px; }
.core-slide-card { padding: 28px; background: #ffffff; border: 1px solid var(--line); border-top: 5px solid var(--navy); border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.04); }
.core-card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.core-card-head strong { color: #ea580c; font-size: 15px; font-weight: 900; }
.core-card-head h3 { margin: 0; font-size: 20px; font-weight: 800; color: #0f172a; }
.core-slide-card p { margin: 0; font-size: 15px; line-height: 1.7; color: #475569; }

/* Basic Topic 2-Col Layout */
.basic-book-card { background: #ffffff; border: 1px solid var(--line); border-radius: 10px; padding: 32px; box-shadow: 0 4px 14px rgba(0,0,0,.04); display: flex; flex-direction: column; gap: 24px; }
.basic-book-field { padding: 18px 24px; background: #ecfdf5; border-left: 6px solid #059669; border-radius: 6px; }
.basic-book-field b { color: #065f46; font-size: 14px; font-weight: 900; display: block; margin-bottom: 4px; }
.basic-book-field p { margin: 0; font-size: 17px; line-height: 1.6; color: #0f172a; font-weight: 700; }
.basic-book-grid-2col { display: grid; grid-template-columns: 1.25fr 1fr; gap: 24px; }
.basic-deep-dive { padding: 24px 28px; background: #f8fafc; border-left: 5px solid var(--navy); border-radius: 6px; }
.basic-deep-dive h5 { margin: 0 0 14px; font-size: 17px; color: #0f172a; font-weight: 900; }
.basic-deep-dive ul { margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.8; color: #475569; }
.basic-right-col { display: flex; flex-direction: column; gap: 18px; }
.basic-checklist-box { padding: 20px 24px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 6px; }
.basic-checklist-box h5 { margin: 0 0 12px; font-size: 16px; color: #166534; font-weight: 900; }
.basic-checks { display: grid; gap: 10px; }
.basic-checks label { display: flex; align-items: flex-start; gap: 10px; font-size: 14.5px; color: #0f172a; font-weight: 600; cursor: pointer; }
.basic-caution-alert { padding: 20px 24px; background: #fff7ed; border-left: 6px solid #ea580c; border: 1px solid #fed7aa; border-radius: 6px; }
.basic-caution-alert b { display: block; font-size: 15.5px; color: #c2410c; margin-bottom: 6px; font-weight: 900; }
.basic-caution-alert p { margin: 0; font-size: 14.5px; line-height: 1.65; color: #475569; }

/* Video Layout - Dual Simultaneous Display */
.dual-videos-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr)); gap: 24px; margin-bottom: 24px; }
.dual-video-card { background: #ffffff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,.04); display: flex; flex-direction: column; }
.dual-video-card-header { padding: 14px 18px; background: #0f2335; color: #ffffff; display: flex; justify-content: space-between; align-items: center; }
.dual-video-card-header.accident { background: #1e293b; border-bottom: 3px solid #ea580c; }
.dual-video-card-header.lecture { background: #0f2335; border-bottom: 3px solid #0284c7; }
.dual-video-card-header h3 { margin: 0; font-size: 15px; font-weight: 800; }
.video-player-box { background: #071a20; display: flex; flex-direction: column; justify-content: space-between; }
.video-frame { width: 100%; aspect-ratio: 16 / 9; }
.video-frame iframe { width: 100%; height: 100%; border: 0; }
.video-direct-bar { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #071a20; border-top: 1px solid #1e293b; font-size: 12px; color: #94a3b8; }
.video-direct-link { color: #38bdf8; font-weight: 700; text-decoration: none; font-size: 12px; }
.video-direct-link:hover { text-decoration: underline; }
.dual-video-info-box { padding: 20px; display: flex; flex-direction: column; gap: 14px; flex: 1; }

/* Video Layout */
.video-book-container { display: grid; grid-template-columns: 1.3fr 0.95fr; gap: 24px; background: #ffffff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,.04); }
.video-analysis-box { padding: 28px; display: flex; flex-direction: column; gap: 16px; }
.video-summary-text { font-size: 15px; line-height: 1.7; color: #475569; margin: 0; }
.combined-video-action-bar { padding: 24px; background: #ffffff; border: 1.5px solid var(--line); border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.04); display: flex; flex-direction: column; gap: 14px; margin-top: 10px; }
.confirm-watch-button { width: 100%; min-height: 52px; background: #ea580c; color: #ffffff; font-size: 15.5px; font-weight: 900; border: 0; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s ease; }
.confirm-watch-button:hover:not(:disabled) { background: #c2410c; }
.video-confirmed-tag { padding: 16px; background: #f0fdf4; border: 1.5px solid #86efac; color: #166534; font-size: 15.5px; font-weight: 900; border-radius: 8px; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }

/* Training Units */
.training-units-list { display: grid; gap: 18px; }
.training-unit-card { background: #ffffff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.03); }
.unit-header { padding: 14px 22px; background: var(--navy); color: #ffffff; display: flex; align-items: center; gap: 12px; }
.unit-tag { font-size: 12px; font-weight: 900; color: #38bdf8; }
.unit-header h3 { margin: 0; font-size: 17px; font-weight: 800; }
.unit-context-box { padding: 16px 22px; background: #f8fafc; border-bottom: 1px solid var(--line); font-size: 14.5px; color: #334155; }
.unit-action-grid { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); }
.safe-action { padding: 16px 22px; background: #f0fdf4; border-right: 1px solid var(--line); }
.safe-action b { color: #166534; font-size: 13.5px; font-weight: 900; display: block; margin-bottom: 6px; }
.safe-action p { margin: 0; font-size: 14.5px; line-height: 1.6; color: #1e293b; }
.unsafe-action { padding: 16px 22px; background: #fff1f2; }
.unsafe-action b { color: #be123c; font-size: 13.5px; font-weight: 900; display: block; margin-bottom: 6px; }
.unsafe-action p { margin: 0; font-size: 14.5px; line-height: 1.6; color: #1e293b; }
.unit-reason { padding: 14px 22px; background: #f8fafc; font-size: 13.5px; color: #64748b; }

/* Exam & Quiz */
.exam-status-bar { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; background: #ffffff; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 24px; }
.course-quiz-item { padding: 24px 0; border-bottom: 1px solid var(--line); }
.course-quiz-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.course-quiz-top span { color: #ea580c; font-size: 13px; font-weight: 900; }
.course-quiz-top small { padding: 3px 8px; background: #f1f5f9; color: #475569; font-size: 11px; font-weight: 800; border-radius: 4px; }
.course-quiz-item h4 { margin: 0 0 16px; font-size: 18px; line-height: 1.5; color: #0f172a; font-weight: 800; }
.course-quiz-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.course-quiz-options label { min-height: 64px; padding: 14px 18px; display: flex; align-items: center; gap: 12px; background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 6px; cursor: pointer; transition: all .15s ease; }
.course-quiz-options label:hover { border-color: #0f172a; }
.course-quiz-options label:has(input:checked) { background: #f0fdf4; border-color: #16a34a; }
.course-quiz-options label.correct { background: #f0fdf4; border-color: #16a34a; }
.course-quiz-options label.wrong { background: #fff1f2; border-color: #e11d48; }
.course-quiz-options input { position: absolute; opacity: 0; pointer-events: none; }
.course-quiz-options label > span { width: 28px; height: 28px; display: grid; place-items: center; flex: 0 0 auto; border: 1.5px solid #94a3b8; border-radius: 50%; font-size: 12px; font-weight: 900; }
.course-quiz-options label:has(input:checked) > span { background: #0f172a; color: white; border-color: #0f172a; }
.course-quiz-options label > p { margin: 0; font-size: 15px; line-height: 1.5; color: #0f172a; font-weight: 600; }
.course-rationale { margin-top: 14px; padding: 14px 18px; display: grid; grid-template-columns: 50px 1fr; gap: 12px; border-radius: 6px; }
.course-rationale.correct { background: #f0fdf4; border-left: 4px solid #16a34a; }
.course-rationale.wrong { background: #fff1f2; border-left: 4px solid #e11d48; }
.course-rationale b { font-size: 13px; font-weight: 900; }
.course-rationale p { margin: 0; font-size: 14px; line-height: 1.6; }

.exam-submit { margin-top: 32px; padding: 24px 28px; background: #ffffff; border: 2px solid #0f172a; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.course-score strong { font-size: 32px; color: #c2410c; }
.course-score.pass strong { color: #16a34a; }

/* Completion Screen */
.completion-slide { display: grid; place-items: center; min-height: 50vh; }
.completion-card { max-width: 680px; width: 100%; text-align: center; padding: 48px 40px; background: #ffffff; border: 2px solid #0f172a; border-radius: 12px; box-shadow: 0 12px 36px rgba(0,0,0,.08); }
.completion-icon { width: 88px; height: 88px; margin: 0 auto 20px; background: #f0fdf4; color: #16a34a; border-radius: 50%; display: grid; place-items: center; }
.completion-card h2 { margin: 0 0 12px; font-size: 30px; font-weight: 900; color: #0f172a; }
.completion-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 20px; background: #f8fafc; border-radius: 8px; margin: 24px 0 28px; }
.completion-actions { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }

/* Bottom Nav Bar */
.bottom-course-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 72px;
  background: #ffffff;
  border-top: 2px solid #0f172a;
  padding: 0 clamp(20px, 4vw, 48px);
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 50;
  box-shadow: 0 -4px 16px rgba(0,0,0,.06);
}

.bottom-nav-btn {
  min-height: 48px;
  padding: 0 24px;
  font-size: 14.5px;
  font-weight: 900;
  border: 1.5px solid #0f172a;
  background: #ffffff;
  color: #0f172a;
  border-radius: 8px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all .15s ease;
}

.bottom-nav-btn:hover:not(:disabled) {
  background: #0f172a;
  color: #ffffff;
}

.bottom-nav-btn:disabled {
  opacity: .35;
  cursor: not-allowed;
}

.bottom-nav-btn.next.highlight {
  background: var(--tf-red);
  color: #ffffff;
  border-color: var(--tf-red);
  box-shadow: 0 4px 12px rgba(204,0,0,.25);
}

.bottom-nav-btn.next.highlight:hover {
  background: #990000;
}

/* Certificate Modal & Print */
.cert-layer { position: fixed; inset: 0; background: rgba(15,23,42,.85); backdrop-filter: blur(4px); z-index: 200; display: grid; place-items: center; padding: 20px; overflow-y: auto; }
.cert-card { max-width: 800px; width: 100%; background: #ffffff; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.35); overflow: hidden; border: 2px solid #0f172a; }
.cert-head { padding: 22px 28px; background: var(--navy); color: white; display: flex; justify-content: space-between; align-items: center; }
.cert-body { padding: 28px; display: flex; flex-direction: column; gap: 20px; }
.cert-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.cert-field { display: flex; flex-direction: column; gap: 5px; }
.cert-field label { font-size: 13px; font-weight: 800; color: #0f172a; }
.cert-field input, .cert-field select { height: 44px; padding: 0 12px; border: 1.5px solid #cbd5e1; border-radius: 6px; font-size: 14px; font-weight: 600; outline: none; }
.cert-fixed-course-box { min-height: 44px; padding: 10px 14px; background: #f0fdf4; border: 1.5px solid #86efac; border-radius: 6px; color: #166534; font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.cert-paper { border: 6px double #0f172a; padding: 32px 36px; background: #fafdfa; position: relative; text-align: center; border-radius: 4px; }
.cert-paper-title { font-size: 26px; font-weight: 900; color: #0f172a; margin: 0 0 20px; border-bottom: 2px solid #0f172a; padding-bottom: 14px; }
.cert-paper-details { font-size: 15.5px; line-height: 1.8; color: #334155; margin: 0 0 24px; }
.cert-paper-meta { display: flex; justify-content: space-around; padding: 14px; background: #f1f5f9; border-radius: 6px; margin-bottom: 20px; font-size: 13px; font-weight: 700; color: #0f172a; }
.cert-seal-area { display: flex; justify-content: space-between; align-items: flex-end; }
.cursive-signature {
  font-family: 'Caveat', 'Dancing Script', 'Brush Script MT', cursive;
  font-size: 34px;
  font-weight: 700;
  color: #0f2335;
  display: inline-block;
  transform: rotate(-4deg);
  letter-spacing: 0.04em;
  line-height: 1;
}
.cert-stamp { display: none; }
.cert-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 18px 28px; background: #f8fafc; border-top: 1px solid var(--line); }

@media (max-width: 768px) {
  .info-badges-grid, .reg-fields-grid, .basic-book-grid-2col, .video-book-container, .course-quiz-options { grid-template-columns: 1fr; }
  .cert-form-grid { grid-template-columns: 1fr; }
  .bottom-course-bar { height: 64px; padding: 0 16px; }
  .bottom-nav-btn { padding: 0 14px; font-size: 12px; }
}

@page {
  size: A4 portrait;
  margin: 12mm 15mm;
}

@media print {
  /* Hide all background website elements and dialog UI */
  .portal-hero,
  .portal-container,
  .course-view-page,
  .cert-head,
  .cert-form-grid,
  .cert-actions,
  .admin-banner,
  button,
  form,
  footer {
    display: none !important;
  }

  html, body {
    background: #ffffff !important;
    color: #000000 !important;
    width: 100% !important;
    height: auto !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow: visible !important;
  }

  .cert-layer {
    position: static !important;
    inset: auto !important;
    background: transparent !important;
    padding: 0 !important;
    margin: 0 !important;
    width: 100% !important;
    height: auto !important;
    overflow: visible !important;
    display: block !important;
    backdrop-filter: none !important;
  }

  .cert-card {
    position: static !important;
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    max-width: 100% !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .cert-body {
    padding: 0 !important;
    margin: 0 !important;
    display: block !important;
  }

  .cert-paper {
    display: block !important;
    position: static !important;
    width: 100% !important;
    max-width: 100% !important;
    box-sizing: border-box !important;
    margin: 0 auto !important;
    padding: 36px 36px !important;
    border: 4px double #0f172a !important;
    background: #ffffff !important;
    border-radius: 4px !important;
    page-break-inside: avoid !important;
    page-break-after: avoid !important;
    page-break-before: avoid !important;
  }

  .cert-paper-title {
    font-size: 24px !important;
    font-weight: 900 !important;
    color: #0f172a !important;
    margin: 0 0 18px !important;
    border-bottom: 2px solid #0f172a !important;
    padding-bottom: 12px !important;
  }

  .cert-paper-details {
    font-size: 14.5px !important;
    line-height: 1.75 !important;
    color: #1e293b !important;
    margin: 0 0 20px !important;
  }

  .cert-paper-meta {
    display: flex !important;
    justify-content: space-around !important;
    padding: 12px 16px !important;
    background: #f1f5f9 !important;
    border-radius: 6px !important;
    margin-bottom: 20px !important;
    font-size: 13px !important;
    font-weight: 700 !important;
    color: #0f172a !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  .cert-seal-area {
    display: flex !important;
    justify-content: space-between !important;
    align-items: flex-end !important;
    padding-top: 10px !important;
  }

  .cursive-signature {
    font-family: 'Caveat', 'Dancing Script', cursive !important;
    font-size: 36px !important;
    font-weight: 700 !important;
    color: #0f2335 !important;
    display: inline-block !important;
    transform: rotate(-4deg) !important;
  }
}

RP) 비치 확인"], "cautions": "제1류~제6류 오분류로 인한 부적합 소화약제 방출 시 폭발 사고를 유발할 수 있습니다."}, {"title": "지정수량의 법적 개념과 배수 합산 계산법", "explanation": "지정수량은 제조소등의 설치 허가, 안전관리자 선임 등 법적 규제의 기준이 되는 최소한의 수량 기준입니다.", "fieldPoint": "2종 이상의 위험물을 함께 보관할 때는 각각의 저장량을 지정수량으로 나눈 '배수의 합'이 1 이상인지 산출", "details": ["배수 계산 공식: (물질A 저장량 / 물질A 지정수량) + (물질B 저장량 / 물질B 지정수량) = 총 배수", "총 배수의 합이 1 이상인 경우 관할 소방서의 제조소등 설치 허가를 반드시 취득해야 함", "허가받은 품명 및 지정수량 배수를 1%라도 초과하여 저장하면 변경허가 위반에 해당"], "checklist": ["현재 보관 중인 각 위험물별 일일 수량 실측", "총 지정수량 배수 합산표 계산", "인허가 허용 배수 초과 여부 확인"], "cautions": "지정수량 이상 무허가 저장 시 즉시 사용정지 명령 및 형사 고발 조치됩니다."}, {"title": "위험물 제조소등의 시설 구분 (제조소·저장소·취급소)", "explanation": "위험물 시설은 성격에 따라 제조소, 저장소(8종), 취급소(4종)로 엄격히 구분되며 위치·구조·설비 기준이 상이합니다.", "fieldPoint": "인천 ICDC는 '위험물 옥내저장소'에 해당하므로 옥내저장소 전용 위치·구조 기술기준 준수", "details": ["제조소: 위험물을 제조할 목적으로 지정수량 이상의 위험물을 취급하는 시설", "저장소 (8종): 옥내저장소, 옥외탱크저장소, 옥내탱크저장소, 지하탱크저장소, 간이탱크, 이동탱크(탱크로리), 옥외저장소, 암반탱크", "취급소 (4종): 주유취급소, 판매취급소, 이송취급소, 일반취급소"], "checklist": ["옥내저장소 보유공지 및 방화구획 유지 상태", "환기 및 배출설비 정상 가동 여부", "바닥 방수 및 유출방지 턱 손상 유무"], "cautions": "저장소 용도 외의 제조나 가공 작업을 수행하면 시설 무단 변경으로 행정처분을 받습니다."}, {"title": "위험물안전관리자 선임 의무 및 직무 권한", "explanation": "제조소등의 관계인은 위험물 취급 자격자를 안전관리자로 선임하여 안전관리 업무를 총괄 수행하게 해야 합니다.", "fieldPoint": "안전관리자 퇴직/해임 시 30일 이내 재선임하고, 선임한 날부터 14일 이내 소방서 신고 필수", "details": ["선임 자격: 위험물기능장, 위험물산업기사, 위험물기능사 또는 한국소방안전원 안전관리자 강습 이수자", "안전관리자 직무: 시설 점검, 작업자 감독, 화재 예방 및 비상 훈련, 기록부 3년 보존", "안전관리자 부재 시 직무대리자를 사전에 지정하여 안전 공백이 발생하지 않도록 관리"], "checklist": ["위험물안전관리자 선임 신고 필증 비치", "직무대리자 지정서 작성 유무", "일일 안전점검 일지 서명 및 이상 조치 기록"], "cautions": "안전관리자 미선임 시 1,500만원 이하의 벌금에 처해집니다."}], "2": [{"title": "제1류 산화성 고체의 정의 및 공통 성상", "explanation": "제1류 위험물은 고체로서 산화력의 잠재적인 위험성을 가지며, 타 물질의 연소를 촉진하는 산화성 물질(자체는 불연성이지만 산소를 다량 함유)입니다.", "fieldPoint": "자체 연소성은 없으나 가연물·유기물과 접촉 시 미세한 마찰·충격만으로도 격렬한 폭발을 일으키므로 격리 보관 필수", "details": ["아염소산염류(50kg), 염소산염류(50kg), 과염소산염류(50kg), 무기과산화물(50kg) - 위험등급 I", "질산염류(300kg), 요오드산염류(300kg), 브롬산염류(300kg) - 위험등급 II", "과망간산염류(1000kg), 중크롬산염류(1000kg) - 위험등급 III", "가열, 충격, 마찰에 의해 분해되어 다량의 산소를 방출하며 가연물의 착화 에너지를 급격히 낮춤"], "checklist": ["보관 구역 내 가연성 포장재(종이, 목재, 플라스틱) 전면 제거 확인", "밀폐용기 포장 상태 및 직사광선 차단 냉암소 유지 확인", "SDS 제7장 취급 및 저장방법 내 혼재 금지 물질 대조"], "cautions": "무기과산화물(과산화나트륨, 과산화칼륨 등)은 물과 반응 시 발열과 함께 산소를 발생하므로 절대 주수 소화 금지(마른 모래 질식소화)."}, {"title": "알칼리금속 과산화물의 금수성 및 주수 금지 기준", "explanation": "제1류 위험물 중 무기과산화물(알칼리금속 과산화물)은 물과 접촉 시 격렬한 발열 반응과 함께 산소를 방출하여 폭발을 유발합니다.", "fieldPoint": "무기과산화물 취급 구역에는 '물기엄금' 표지판 및 탄산수소염류 분말소화기, 마른 모래 상시 비치", "details": ["반응식 예시: 2Na2O2 + 2H2O → 4NaOH + O2↑ + 다량의 반응열(126kJ)", "물, 산, 가연물과의 접촉을 원천 차단하기 위해 이중 밀폐 용기 사용", "습도가 높은 우천 시 또는 지하 침수 우려 구역 보관 절대 금지"], "checklist": ["무기과산화물 보관실 내 '물기엄금' 청색 표지 부착 확인", "보관 랙 지상고 0.15m 이상 이격 및 방수 포장 확인", "소화약제 적응성: 마른모래, 팽창질석, 탄산수소염류 분말소화기 비치 확인"], "cautions": "무기과산화물 화재 시 포 소화설비나 옥내소화전 등 수계 소화약제 방사 시 폭발 확산(소방기본법 및 위험물안전관리법 위반)."}, {"title": "염소산염류 및 질산염류의 열분해 및 폭발 위험성", "explanation": "염소산칼륨(KClO3), 질산암모늄(NH4NO3) 등은 고온 가열 또는 유기물 오염 시 급격한 자기 가속 분해를 일으킵니다.", "fieldPoint": "베이루트 항구 폭발 사고와 같이 질산암모늄의 장기 방치 및 유류·가연물 오염은 원폭급 폭발로 이어짐", "details": ["질산암모늄 분해 반응: 2NH4NO3 → 2N2 + 4H2O + O2 (약 250℃ 이상)", "유기물, 금속분말(알루미늄, 마그네슘) 혼합 시 폭약(ANFO 등)으로 전이", "보관소 내 환기 불량 시 분해열 축적으로 자연발화 및 폭연 발생"], "checklist": ["저장소 내부 온도 30℃ 이하 유지 및 강제 환기설비 가동", "바닥 균열 및 유류 누출부 침투 방지 코팅 상태 점검", "질산염류 단독 보관 및 타 위험물과의 1m 이상 이격 거리 준수"], "cautions": "질산암모늄 화재 시 초기 다량 주수로 냉각 진압하되, 밀폐 공간 진압은 폭발 위험으로 즉시 퇴각."}, {"title": "제1류 위험물의 저장·취급 설비 기준", "explanation": "제1류 위험물 제조소 및 저장소는 불연재료 구조, 방습 설비 및 환기설비를 완비해야 합니다.", "fieldPoint": "용기 파손 시 즉시 회수할 수 있는 불연성 전용 회수 용기 및 비금속 스쿠프(Scoop) 비치", "details": ["건축물 바닥은 내수성 및 방습 구조로 시공하고 경사도 유지", "보관 선반은 불연재료로 제작하고 하중 변형 및 전도 방지 조치 완비", "출입구 턱 높이 0.15m 이상 시공 및 침수 방지 드레인 밸브 설치"], "checklist": ["저장 선반 높이 제한(일반 3~4m, 기계식 6m) 준수 여부", "스파크 발생 방지용 황동/플라스틱 도구 사용 여부", "비상 비산 방지용 중화제 및 건조사 보관함 충전 상태"], "cautions": "강철제 스쿠프 사용 시 마찰 불티로 인한 폭발 위험이 있으므로 방폭/비점화 공구만 사용."}, {"title": "제1류 위험물 화재 시 소화약제 적응성 및 비상 SOP", "explanation": "제1류 위험물 화재는 물질의 종류(알칼리금속 과산화물 여부)에 따라 소화 방법이 정반대이므로 사전 구분이 핵심입니다.", "fieldPoint": "무기과산화물은 '마른모래 질식소화', 그 외 산화성 고체는 '다량의 냉각 주수소화' 원칙 적용", "details": ["일반 산화성 고체(염소산염류, 질산염류): 다량의 물을 방사하여 열분해 온도 이하로 급격 냉각", "무기과산화물: 물 접촉 절대 금지, 건조사(마른 모래), 팽창질석, 팽창진주암으로 완전 질식", "소화 작업자는 산소결핍 및 유독가스(NOx 등) 대비 공기호흡기(SCBA) 필수 착용"], "checklist": ["초기 30초 내 취급 물질 SDS 확인 및 금수성 여부 판정", "비상 대피 동선 확보 및 현장 23명 신속 롤콜 완료", "119 소방대 도착 시 물질명 및 금수성 여부 즉각 브리핑"], "cautions": "오인 주수로 인한 폭발 사고 발생 시 형사 책임 및 막대한 인명 피해 초래."}], "3": [{"title": "제2류 가연성 고체의 성상 및 화재 특성", "explanation": "제2류 위험물은 낮은 착화온도를 가지며, 연소 속도가 매우 빠르고 연소 시 유독가스를 방출하는 고체 가연물입니다.", "fieldPoint": "미세 분진 상태로 공기 중에 부유할 경우 점화원 접촉 시 파괴적인 '분진폭발'을 일으키므로 집진 관리 필수", "details": ["황화린(100kg), 적린(100kg), 유황(100kg) - 위험등급 II", "철분(500kg), 금속분(500kg), 마그네슘(500kg), 인화성고체(1000kg) - 위험등급 III", "금속분류(철, 마그네슘 등)는 산이나 물과 접촉 시 가연성 수소가스(H2)를 발생시킴"], "checklist": ["작업장 내 분진 축적 방지를 위한 국소배기장치 가동 확인", "정전기 방지용 접지선 체결 및 제전복 착용 상태 점검", "가연성 고체 보관 구역 '화기주의/화기엄금' 표지판 점검"], "cautions": "유황 연소 시 치명적인 독성가스인 이산화황(SO2)이 다량 발생하므로 방독마스크 착용 필수."}, {"title": "황화린·적린·유황의 안전 취급 및 화기 차단", "explanation": "삼황화린(P4S3), 오황화린(P2S5), 칠황화린(P4S7) 및 적린은 마찰과 충격에 민감하며 분해 시 유독성 가스를 발생합니다.", "fieldPoint": "오황화린은 물과 접촉 시 유독성 황화수소(H2S) 및 인산을 생성하므로 방습 관리 철저", "details": ["황화린 물 반응식: P2S5 + 8H2O → 2H3PO4 + 5H2S↑", "적린은 마찰·충격에 강하지만 가열 시 260℃에서 백린(제3류)으로 기화·변환 위험", "유황은 마찰 전하 축적이 매우 쉬워 이송 및 분쇄 시 정전기 폭발 위험 최고 등급"], "checklist": ["저장소 습도 60% 이하 유지 및 밀폐 드럼 상태 점검", "유황 이송 배관 접지 저항(100Ω 이하) 측정", "황화수소 가스 감지기 작동 상태 점검"], "cautions": "황화수소는 100ppm 이상 농도 흡입 시 순식간에 후각 마비 및 사망에 이르는 맹독성 가스입니다."}, {"title": "철분·금속분·마그네슘의 금수성 반응 및 D급 소화", "explanation": "철분, 알루미늄분, 마그네슘 등 금속 가연물은 물이나 산과 접촉 시 폭발성 수소 가스를 방출합니다.", "fieldPoint": "금속분류 화재에는 물, 포, 이산화탄소, 할로겐 화합물 소화약제 방사 절대 금지", "details": ["마그네슘 물 반응식: Mg + 2H2O(고온) → Mg(OH)2 + H2↑", "마그네슘 CO2 반응식: 2Mg + CO2 → 2MgO + C (산소 공급 역할로 화재 격화)", "D급 금속화재 전용 소화약제(금속 화재용 특수 분말, 팽창질석, 건조사)만 유효"], "checklist": ["금속 가공 구역 '물기엄금' 적색 표지 부착 확인", "D급 전용 분말소화기 및 건조사 전진 배치", "절삭유 및 수분 오염 여부 일일 점검표 작성"], "cautions": "금속분 화재에 물을 뿌리면 수소 폭발 및 수증기 폭발로 비산하여 작업자 전신 화상 유발."}, {"title": "인화성 고체의 위험성 및 인화점 관리", "explanation": "인화성 고체는 고형알코올, 락커퍼티 등 인화점이 40℃ 미만인 가연성 고체로서 유증기 인화 위험이 높습니다.", "fieldPoint": "상온에서 인화성 유증기를 상시 방출하므로 통풍이 양호한 장소에서 밀폐 용기 보관", "details": ["지정수량 1,000kg 기준 엄격 적용 및 수량 배수 합산 관리", "작업장 내 점화원(스파크, 나화, 고온 표면) 원천 차단", "용기 개방 작업 시 국소배기장치 가동 및 정전기 제거"], "checklist": ["인화성 고체 보관실 방폭 환기팬 가동 확인", "용기 뚜껑 밀폐 및 가스켓 경화 여부 점검", "작업장 인근 위험물 취급 기준 게시판 점검"], "cautions": "인화성 고체 용기 개방 방치 시 실내 유증기 체류로 전등 스위치 스파크에 폭발 점화 위험."}, {"title": "제2류 위험물 분진폭발 방지 대책 및 비상 대응", "explanation": "미세 금속분 및 유황 분진의 폭발 한계 농도 도달을 방지하기 위한 엔지니어링 대책을 수립합니다.", "fieldPoint": "분진 청소 시 압축공기 분사 금지(부유 유발), 반드시 방폭형 진공청소기 또는 습식 청소 실시", "details": ["불활성가스(N2, Ar) 치환 및 산소 농도 제어 설비 가동", "분진폭발 방출구(Explosion Vent) 및 폭발 방지 밸브 정상 작동 점검", "화재 발생 시 초기 진압 한계 판단 후 30초 내 전원 비상 대피"], "checklist": ["집진기 내부 차압 및 분진 배출 상태 확인", "방폭 진공청소기 접지선 체결 상태 점검", "비상 대피 유도등 점등 및 비상문 개방 상태 확인"], "cautions": "빗자루나 에어건으로 분진을 털어내면 공기 중 폭발성 분진운이 형성되어 정전기에 즉각 폭발."}], "4": [{"title": "제3류 위험물의 성상 및 류별 위험 등급", "explanation": "제3류 위험물은 공기 중에서 자연발화하거나 물과 접촉하여 가연성 가스를 발생하며 폭발하는 최고 위험 물질군입니다.", "fieldPoint": "공기(산소)와 물(습기) 양쪽 모두와의 접촉을 차단해야 하므로 전용 보호액 침지 또는 불활성가스 밀봉 필수", "details": ["칼륨(10kg), 나트륨(10kg), 알킬알루미늄(10kg), 알킬리튬(10kg) - 위험등급 I", "황린(20kg), 알칼리금속류(50kg), 알칼리토금속류(50kg), 유기금속화합물(50kg) - 위험등급 II", "금속의 수소화물(300kg), 금속의 인화물(300kg), 탄화칼슘/탄화알루미늄(300kg) - 위험등급 III"], "checklist": ["칼륨·나트륨 석유계 보호액(유동파라핀, 등유) 완전 침지 확인", "황린 보관 시 pH 9 이상의 물속 보관 상태 점검", "보관 용기 질소(N2) 봉입 압력 게이지 점검"], "cautions": "황린은 물속에 보관하고, 칼륨·나트륨은 석유 속에 보관하는 상반된 특성을 절대 혼동 금지."}, {"title": "알킬알루미늄 및 알킬리튬의 극위험성과 비상 차단", "explanation": "트리에틸알루미늄((C2H5)3Al) 등은 공기 중 노출 즉시 폭발적으로 자연발화하며 물과 맹렬히 반응합니다.", "fieldPoint": "미세 누출 시에도 즉시 백색 연기와 함께 자발화하므로 불활성가스 가압 이송 배관 점검 철저", "details": ["알킬알루미늄 물 반응: (C2H5)3Al + 3H2O → Al(OH)3 + 3C2H6(에탄가스) + 막대한 반응열", "희석제(헥산, 헵탄 등)를 첨가하여 농도를 제어하며 전용 밸브 스테이션 운용", "비상 시 원격 긴급차단밸브(Emergency Shut-off Valve) 작동 체계 구축"], "checklist": ["이송 배관 헬륨/질소 리크 테스트(Leak Test) 완료 여부", "비상 원격 차단 밸브 연동 테스트 확인", "전용 팽창질석 및 D급 소화기 현장 비치"], "cautions": "알킬알루미늄 누출 시 일반 소화기 방사 시 폭발 반응이 가속되므로 접근 금지 및 즉시 격리."}, {"title": "탄화칼슘(카바이드) 및 금속 인화물의 물 반응 가스", "explanation": "탄화칼슘(CaC2)은 물과 반응하여 인화성 아세틸렌(C2H2) 가스를 방출하고, 인화알루미늄은 맹독성 포스핀(PH3)을 방출합니다.", "fieldPoint": "반응 생성 가스가 극도의 인화성 및 맹독성을 띠므로 보관 드럼 완전 밀봉 및 방습 유지", "details": ["탄화칼슘 반응식: CaC2 + 2H2O → Ca(OH)2 + C2H2↑ (아세틸렌 폭발범위 2.5~81%)", "인화알루미늄 반응식: AlP + 3H2O → Al(OH)3 + PH3↑ (포스핀 자연발화 및 호흡마비)", "수산화칼슘 침전물 발열로 인화 가스 즉각 점화 위험"], "checklist": ["드럼 뚜껑 방수 가스켓 밀착 및 밴드 체결 상태 확인", "가연성/독성 가스 누출 감지 경보기 작동 상태 점검", "보관창고 배수 턱 및 바닥 방수 코팅 점검"], "cautions": "카바이드 드럼 개봉 시 습식 절단기 사용 절대 금지(발생 아세틸렌에 즉각 폭발)."}, {"title": "제3류 위험물의 법정 시설 및 보유공지 기준", "explanation": "제3류 위험물 옥내저장소는 완전 방수벽체, 불연 지붕, 바닥 배수 경사 및 턱을 설치해야 합니다.", "fieldPoint": "소화용수 유입 및 침수를 원천 방지하기 위해 지반고보다 0.3m 이상 높은 바닥 구조 시공", "details": ["지정수량 10배 초과 시 법정 보유공지 3m 이상(20배 초과 시 5m 이상) 확보", "외벽 및 기둥은 내화구조, 창문 없는 밀폐 방수 구조 원칙", "강제 통풍 환기구에는 빗물 유입 방지 후드 및 방충망 설치"], "checklist": ["보관실 바닥 균열 및 수분 침투 흔적 확인", "보유공지 내 타 물품 적치 여부 확인", "'물기엄금' 청색 바탕 백색 문자 표지 부착 상태"], "cautions": "제3류 위험물 저장소 내 스프링클러나 옥내소화전 배관 통과 절대 금지(동파 누수 시 폭발 위험)."}, {"title": "제3류 위험물 화재 시 비상 대응 SOP", "explanation": "제3류 위험물 화재 진압 시 유일하게 허용되는 소화약제는 마른 모래, 팽창질석, 팽창진주암 및 특수 D급 분말입니다.", "fieldPoint": "황린 화재(물속 보관)는 물로 냉각 가능하나, 그 외 모든 제3류는 주수 절대 금지", "details": ["황린(P4) 화재: 다량의 물을 방사하여 연소 억제 후 흙이나 모래로 피복", "금수성 물질 화재: 건조사 100kg 이상 포대 전개 및 완전 피복 질식", "작업자는 방열복, 내열장갑 및 양압식 공기호흡기 착용 후 원거리 진압"], "checklist": ["사업장 내 건조사(마른모래) 전용 보관함 3개 이상 완비", "119 상황실 신고 시 '제3류 금수성 물질 물기엄금' 명확히 고지", "풍하측 근로자 즉각 대피 및 반경 100m 통제선 설정"], "cautions": "소방차 주수 시 폭발 파편이 수백 미터 비산하므로 소방대 도착 전 현장 반경 통제 완료."}], "5": [{"title": "제4류 인화성 액체의 구분 및 인화점 체계", "explanation": "제4류 위험물은 상온에서 인화성 유증기를 방출하며 액체 상태에서 인화의 위험성을 갖는 물질입니다.", "fieldPoint": "인화점이 낮을수록 상온에서 유증기가 다량 방출되어 폭발 위험이 급증하므로 인화점 관리 철저", "details": ["특수인화물(50L): 디에틸에테르(-45℃), 이황화탄소(-30℃), 아세트알데히드(-38℃)", "제1석유류(비수용성 200L, 수용성 400L): 휘발유(-43℃), 톨루엔(4℃), 아세톤(-18℃)", "알코올류(400L): 메틸알코올(11℃), 에틸알코올(13℃) - 탄소수 1~3 포화 1가 알코올", "제2석유류(1000L/2000L), 제3석유류(2000L/4000L), 제4석유류(6000L), 동식물유류(10000L)"], "checklist": ["취급 용기별 인화점 및 SDS 9번 물리화학적 특성 확인", "수용성/비수용성 구분에 따른 지정수량 차등 적용 확인", "지정수량 배수 계산 시 수용성 알코올류 400L 기준 적용 확인"], "cautions": "특수인화물 및 제1석유류는 영하의 겨울철에도 인화성 유증기가 폭발 범위에 도달해 있습니다."}, {"title": "정전기 발생 메커니즘과 방폭 접지·본딩 실무", "explanation": "제4류 액체의 이송·교반·분체 투입 시 발생하는 정전기 스파크는 유증기 폭발의 1대 점화원입니다.", "fieldPoint": "용기 간 액체 이송 시 반드시 '본딩(Bonding) 집게'를 금속 부위에 체결하여 전위차 제로화", "details": ["정전기 발생 3요소: 마찰, 박리, 유동 대전 (부도체 배관 내 유속이 빠를수록 전하 축적)", "정전기 방지 대책: 접지(Grounding, 100Ω 이하), 본딩, 유속 제한(1m/s 이하), 습도 70% 유지", "작업자 대책: 제전화(저항치 10^5~10^8Ω), 제전복 착용 및 인체 접지봉 터치 후 진입"], "checklist": ["드럼 펌프 접지선 및 인터락(Interlock) 연동 상태 점검", "작업장 출입구 인체 정전기 방전 패드 부착 및 측정", "정전기 접지 클램프 도색 박리 부위 접촉 확인"], "cautions": "플라스틱 버킷이나 비전도성 호스로 유류를 주입하면 정전기가 방출되지 못해 즉각 폭발."}, {"title": "유증기 배출 설비 및 인화방망(Flame Arrester) 유지관리", "explanation": "인화성 유증기는 공기보다 무거워 바닥에 체류하므로 하부 강제 배출 설비와 탱크 통기관 인화방망이 필수적입니다.", "fieldPoint": "탱크 통기관 끝단의 구리 그물망(인화방망)에 먼지·이물질 폐쇄 시 탱크 팽창 및 파열 위험", "details": ["유증기 증기비중: 가솔린(3~4), 톨루엔(3.14), 에테르(2.55) - 바닥 밀착 확산", "환기설비는 자연환기구(바닥 인근), 배출설비는 국소배기 강제 배풍기(방폭형) 시공", "통기밸브(Breather Valve) 및 40메시 이상 황동제 인화방망 설치"], "checklist": ["인화방망 메쉬 부식 및 분진 막힘 여부 분기별 점검", "바닥 배기 덕트 흡입구 장애물 적치 여부 확인", "방폭 모터 및 방폭 스위치 인증 라벨(KCs/Ex d) 점검"], "cautions": "유증기 환기 배출구를 다른 작업실이나 배수구로 유입되도록 연결하면 연쇄 폭발 발생."}, {"title": "제4류 위험물의 옥내·외 저장탱크 및 방유제 시설기준", "explanation": "대용량 제4류 저장탱크 파손 시 유출 확산을 막기 위해 방유제(Dike)의 용량과 구조 기준을 준수해야 합니다.", "fieldPoint": "방유제 용량: 단일 탱크는 탱크 용량의 110%, 2기 이상은 최대 탱크 용량의 110% 이상 확보", "details": ["방유제 높이: 0.5m 이상 3.0m 이하, 철근콘크리트 또는 흙벽 불연 구조", "방유제 내 배수 드레인 밸브는 평상시 '닫힘(Closed)' 상태 유지 및 잠금장치 체결", "탱크와 방유제 간 이격 거리: 높이 15m 미만 탱크는 직경의 1/3 이상 확보"], "checklist": ["방유제 배수 밸브 닫힘 상태 및 우수 배출 시에만 개방 확인", "방유제 벽체 균열, 침하 및 방수 몰탈 마감 점검", "탱크 수위계, 고액면 경보장치(Overfill Alarm) 작동 시험"], "cautions": "방유제 드레인 밸브를 열어둔 채 방치하면 탱크 파손 시 유출 유류가 공공 수역으로 확산."}, {"title": "제4류 위험물 화재 진압 및 포(Foam) 소화약제 실무", "explanation": "제4류 유류화재는 물을 뿌리면 유류가 수면에 떠서 화재가 확산되므로 포(Foam) 질식소화가 기본입니다.", "fieldPoint": "수용성 알코올류 화재에는 일반 단백포·수성막포 방사 시 포가 소멸하므로 '내알코올포' 필수 사용", "details": ["비수용성 유류(휘발유, 톨루엔 등): 수성막포(AFFF) 방사로 유막 형성 및 공기 차단 질식", "수용성 유류(메탄올, 에탄올, 아세톤): 알코올포(Alcohol-Resistant Foam) 방사", "소화기 적응성: ABC 분말소화기, CO2 소화기, B급 유류 전용 폼 소화기"], "checklist": ["보관 위험물 수용성 여부 확인 및 내알코올포 약제 비치 확인", "포 소화설비 혼합장치(Proportioner) 및 약제 저장탱크 점검", "유류 유출 대비 흡착포, 오일펜스 및 모래주머니 전진 배치"], "cautions": "유류 화재에 고압 봉상 주수 시 유류 비산(Slop-over / Boil-over)으로 작업자 전신 화상."}], "6": [{"title": "제5류 위험물 (자기반응성 물질) - 법적 요건 및 기초 이론", "explanation": "제5류 위험물 (자기반응성 물질)에 관한 위험물안전관리법 및 기술기준 규칙의 핵심 조항을 학습합니다. 유기과산화물, 질산에스테르류, 니트로화합물, 아조화합물에 대한 법정 관리 기준이 적용됩니다.", "fieldPoint": "작업 전 유기과산화물·니트로화합물에 대한 물리화학적 특성 및 SDS 15번 법적 규제현황 확인 필수", "details": ["제5류 위험물 (자기반응성 물질)의 적용 대상 및 위험물안전관리법 상 법정 기준 완벽 준수", "유기과산화물·니트로화합물 취급 시 공정 위험요인을 사전에 발굴하고 안전 인터락 확인", "지정수량 배수 초과 여부 일일 점검 및 무단 증설 절대 금지"], "checklist": ["제5류 위험물 (자기반응성 물질) 인허가 허가증 및 도면 일치 여부 확인", "작업 표준작업지침서(SOP) 현장 비치 및 숙지", "취급 작업자 대상 위험물 법정 교육 이수 확인"], "cautions": "제5류 위험물 (자기반응성 물질)의 법정 기준 위반 시 3년 이하 징역 또는 3천만원 이하 벌금 및 사용정지 행정처분."}, {"title": "제5류 위험물 (자기반응성 물질) - 현장 시설 및 설비 기술기준", "explanation": "제5류 위험물 (자기반응성 물질)의 안전한 운용을 위해 시설 구조, 방화벽, 보유공지 및 환기·배출 설비 기준을 충족해야 합니다.", "fieldPoint": "SADT(자체가속분해온도) 이하 냉각 관리 및 가열·마찰·충격 원천 차단", "details": ["주요 구조부는 내화구조 및 불연재료로 시공하고 균열 여부 주기적 점검", "인화성 유증기 및 분진 폭발 방지를 위한 방폭 인증(Ex d) 설비 유지", "출입구 턱 및 집유조 설치로 외부 환경 누출 및 확산 차단"], "checklist": ["방폭 전기설비 접지 저항(100Ω 이하) 측정 기록 확인", "환기 배출구 인화방망(Flame Arrester) 청결 상태 점검", "보유공지 내 가연성 장애물 무단 적치 여부 확인"], "cautions": "형식적인 점검은 설비 결함으로 인한 대형 폭발을 막을 수 없으므로 실제 작동 시험 철저 수행."}, {"title": "제5류 위험물 (자기반응성 물질) - 표준작업지침(SOP) 및 안전 취급 수칙", "explanation": "제5류 위험물 (자기반응성 물질) 취급 시 작업자가 지켜야 할 일상 점검, 이송 및 혼재 방지 절차입니다.", "fieldPoint": "대량 냉각 주수 및 질식소화 불가 원칙", "details": ["작업 시작 전 2인 1조 작업 편성 및 상호 교차 점검 수행", "유류 및 화학물질 이송 시 전용 배관 본딩 및 정전기 접지 클램프 체결", "취급 용기 밀봉 상태 확인 및 전도·낙하 방지 조치 완비"], "checklist": ["작업 전 안전 보호구(내화학복, 방독마스크, 제전화) 착용 확인", "이송 펌프 및 밸브 누설 유무 육안 점검", "작업 tions": "인원 점검(롤콜) 미완수 시 화재 현장 내부 고립자 파악 불가로 대형 인명 피해 발생."}], "25": [{"title": "1. 위험물 지도부터 시작", "explanation": "교육의 기준은 교과서의 예시가 아니라 사업장에 실제 존재하는 물질입니다. 물질명, 위험물 분류, 지정수량, 최대 보유량, 보관 위치, SDS 개정일과 담당자를 하나의 목록으로 관리합니다.", "fieldPoint": "✓작업 전 본인이 취급할 물질명·위험물 류·보관실·승인 작업절차를 확인합니다.", "details": ["✓작업 전 본인이 취급할 물질명·위험물 류·보관실·승인 작업절차를 확인합니다.", "✓자격이 없는 작업자는 안전관리자 또는 자격 취급자가 참여·감독하지 않으면 취급을 시작하지 않습니다.", "✓협력업체와 방문자는 출입 전 금지행위, 경보, 대피경로와 비상연락 방법을 안내받습니다.", "✓위험물안전관리자의 작업중지·시정 지시는 생산일정보다 우선합니다."], "checklist": ["1. 위험물 지도부터 시작 예방규정 준수 확인", "현장 보호구 및 점검표 확인", "비상연락망 및 롤콜 숙지"], "cautions": "1. 위험물 지도부터 시작 위반 시 ICDC 안전 규정 위반 및 법적 행정처분 대상이 됩니다."}, {"title": "위험물 목록과 현장 대조", "explanation": "승인 목록과 실제 보관상태가 일치해야 수량관리·혼재방지·소방대응이 정확해집니다.", "fieldPoint": "✓목록에는 제품명, 성분 또는 대표물질, 위험물 분류, 지정수량, 최대보유량, 보관위치와 SDS 개정일을 기록합니다.", "details": ["✓목록에는 제품명, 성분 또는 대표물질, 위험물 분류, 지정수량, 최대보유량, 보관위치와 SDS 개정일을 기록합니다.", "✓용기 라벨의 제품명·농도·공급자·수량을 목록과 대조하고 유사명칭 제품을 같은 물질로 추정하지 않습니다.", "✓냉장·상온, 방유·환기, 차광 등 보관조건이 승인 내용과 일치하는지 확인합니다.", "✓재고가 없어진 품목도 폐기물·반품·빈 용기 처리 완료 전까지 추적합니다."], "checklist": ["위험물 목록과 현장 대조 예방규정 준수 확인", "현장 보호구 및 점검표 확인", "비상연락망 및 롤콜 숙지"], "cautions": "위험물 목록과 현장 대조 위반 시 ICDC 안전 규정 위반 및 법적 행정처분 대상이 됩니다."}, {"title": "허가수량과 지정수량 배수", "explanation": "구매량이 아니라 같은 시점에 저장·취급될 수 있는 최대량을 허가·승인 범위와 비교합니다.", "fieldPoint": "✓현재 재고에 입고예정량과 작업장 반출량을 더해 예상 최대량을 계산합니다.", "details": ["✓현재 재고에 입고예정량과 작업장 반출량을 더해 예상 최대량을 계산합니다.", "✓혼합 저장 장소는 물질별 지정수량 배수를 회사 승인 산식으로 합산합니다.", "✓한도 초과가 예상되면 입고일·사용계획을 조정하고 미승인 장소로 분산하지 않습니다.", "✓수량·품명·위치 변경이 허가사항에 미치는 영향은 반입 전에 안전관리자와 확인합니다."], "checklist": ["허가수량과 지정수량 배수 예방규정 준수 확인", "현장 보호구 및 점검표 확인", "비상연락망 및 롤콜 숙지"], "cautions": "허가수량과 지정수량 배수 위반 시 ICDC 안전 규정 위반 및 법적 행정처분 대상이 됩니다."}, {"title": "불일치와 변경관리", "explanation": "목록에 없는 물질이나 위치 변경은 작은 차이가 아니라 사고 대응정보가 틀렸다는 신호입니다.", "fieldPoint": "✓사용을 보류하고 용기 주변을 안전하게 유지한 뒤 담당자에게 보고합니다.", "details": ["✓사용을 보류하고 용기 주변을 안전하게 유지한 뒤 담당자에게 보고합니다.", "✓신규 물질·농도·공급자·용기·보관위치 변경은 SDS 검토와 혼재·소화·누출 대응 검토를 거칩니다.", "✓승인 후 목록, 표지, 대피도, 소화설비 배치도와 t": ["1. 정상상태의 기준을 명확히 예방규정 준수 확인", "현장 보호구 및 점검표 확인", "비상연락망 및 롤콜 숙지"], "cautions": "1. 정상상태의 기준을 명확히 위반 시 ICDC 안전 규정 위반 및 법적 행정처분 대상이 됩니다."}, {"title": "정상기준과 이상기준", "explanation": "‘이상 없음’이라는 판단을 일관되게 하려면 항목별 허용상태와 조치기준이 필요합니다.", "fieldPoint": "✓온도·습도·가스농도 등 계측값의 정상범위와 경보값을 표시합니다.", "details": ["✓온도·습도·가스농도 등 계측값의 정상범위와 경보값을 표시합니다.", "✓소화기 압력, 비상조명, 경보와 환기설비의 확인방법을 정합니다.", "✓반복 누유·성에·진동·냄새 등 작은 변화도 이전 기록과 비교합니다.", "✓측정기 고장이나 확인 불가 상태도 부적합으로 기록하고 조치합니다."], "checklist": ["정상기준과 이상기준 예방규정 준수 확인", "현장 보호구 및 점검표 확인", "비상연락망 및 롤콜 숙지"], "cautions": "정상기준과 이상기준 위반 시 ICDC 안전 규정 위반 및 법적 행정처분 대상이 됩니다."}, {"title": "수량과 적치관리", "explanation": "현재 수량과 입고·출고 계획을 함께 보아 허가수량 초과와 통로 적치를 예방합니다.", "fieldPoint": "✓저장실·품목별 실재고와 장부를 정기적으로 대조합니다.", "details": ["✓저장실·품목별 실재고와 장부를 정기적으로 대조합니다.", "✓예정 입고량을 반영해 한도 초과 전에 입고일이나 사용계획을 조정합니다.", "✓용기 간격, 벽·천장 이격과 지정수량 배수에 따른 안전공간을 유지합니다.", "✓미승인 임시 장소, 통로, 비상구 앞에 용기를 적치하지 않습니다."], "checklist": ["수량과 적치관리 예방규정 준수 확인", "현장 보호구 및 점검표 확인", "비상연락망 및 롤콜 숙지"], "cautions": "수량과 적치관리 위반 시 ICDC 안전 규정 위반 및 법적 행정처분 대상이 됩니다."}, {"title": "부적합 시정과 기록", "explanation": "발견한 이상은 책임자·기한·완료확인이 있어야 닫을 수 있습니다.", "fieldPoint": "✓즉시 위험은 작업중지·격리·접근통제 등 임시조치로 먼저 통제합니다.", "details": ["✓즉시 위험은 작업중지·격리·접근통제 등 임시조치로 먼저 통제합니다.", "✓중대한 사항은 안전관리자와 최고책임자에게 신속히 보고합니다.", "✓보수·교체·절차변경의 책임자와 완료기한을 지정합니다.", "✓재점검으로 효과를 확인하고 반복 시 근본원인과 추가 개선을 검토합니다."], "checklist": ["부적합 시정과 기록 예방규정 준수 확인", "현장 보호구 및 점검표 확인", "비상연락망 및 롤콜 숙지"], "cautions": "부적합 시정과 기록 위반 시 ICDC 안전 규정 위반 및 법적 행정처분 대상이 됩니다."}, {"title": "일상점검과 최대수량 관리 - 비상 대피 훈련", "explanation": "인천 ICDC 옥내저장소 일상점검과 최대수량 관리 관련 현장 작업 지침입니다.", "fieldPoint": "작업 전 안전 보호구 착용 및 점검표 작성 필수", "details": ["ICDC 예방규정 표준작업지침 준수", "이상 발생 시 Stop-Work 발동 및 관리자 보고", "비상 대피로 3개 동선 확보"], "checklist": ["작업 전 안전 보호구 완비", "현장 점검표 체크 완료", "비상연락망 비치 확인"], "cautions": "현장 안전 규정 준수는 작업자 본인과 동료의 생명을 지키는 기본입니다."}], "30": [{"title": "1. 생명안전과 확산방지가 우선", "explanation": "정체불명, 유독성, 인화성 증기, 반응성, 대량누출 또는 배수로 유입 우려가 있으면 접근하지 말고 경보·격리·대피·신고를 실시합니다.", "fieldPoint": "✓물질 top-Work 발동 및 관리자 보고", "비상 대피로 3개 동선 확보"], "checklist": ["작업 전 안전 보호구 완비", "현장 점검표 체크 완료", "비상연락망 비치 확인"], "cautions": "현장 안전 규정 준수는 작업자 본인과 동료의 생명을 지키는 기본입니다."}], "31": [{"title": "1. 먼저 알리고 대피", "explanation": "화재를 발견하면 사내 경보, 119 신고, 주변 작업자 전파와 대피를 우선합니다. 초기진압은 훈련받은 사람이 피난로를 확보한 상태에서 작고 통제 가능한 화재에 한해 시도합니다.", "fieldPoint": "✓사내 경보를 발령하고 119에 저장실·물질·연기·인원정보를 알립니다.", "details": ["✓사내 경보를 발령하고 119에 저장실·물질·연기·인원정보를 알립니다.", "✓주변 작업자에게 전파하고 안전한 경로로 대피합니다.", "✓방화문·비상구 등 안전설비를 임의로 고정하거나 막지 않습니다.", "✓훈련되지 않은 작업자는 물질을 옮기거나 화재실에 재진입하지 않습니다."], "checklist": ["1. 먼저 알리고 대피 예방규정 준수 확인", "현장 보호구 및 점검표 확인", "비상연락망 및 롤콜 숙지"], "cautions": "1. 먼저 알리고 대피 위반 시 ICDC 안전 규정 위반 및 법적 행정처분 대상이 됩니다."}, {"title": "저장실별 대응기준", "explanation": "저장실 번호와 방 이름, 위험물 류는 대응정보의 출발점이며 실제 SDS와 현장 비상계획을 함께 봅니다.", "fieldPoint": "✓저장실 7-FSCT 방, 저장실 8-CDCT (DWCT 냉장방), 저장실 9-DWCT 방은 현장계획상 주수·수계 소화설비 사용 금지 구역임을 명확히 전달합니다.", "details": ["✓저장실 7-FSCT 방, 저장실 8-CDCT (DWCT 냉장방), 저장실 9-DWCT 방은 현장계획상 주수·수계 소화설비 사용 금지 구역임을 명확히 전달합니다.", "✓저장실 2-CFCS 방·저장실 5-FLCS 방·저장실 6-FLBL 방의 제4류는 증기의 낮은 곳 체류와 유동화재 확대를 고려합니다.", "✓저장실 4-OPCS 방의 제5류는 열·충격과 자기분해·용기폭발 가능성을 고려해 안전거리를 확보합니다.", "✓저장실 1-OXCS 방과 저장실 3-COCT(OXCS 냉장방)의 제1·6류는 산화성·부식성·수분반응 여부와 주변 가연물을 확인합니다."], "checklist": ["저장실별 대응기준 예방규정 준수 확인", "현장 보호구 및 점검표 확인", "비상연락망 및 롤콜 숙지"], "cautions": "저장실별 대응기준 위반 시 ICDC 안전 규정 위반 및 법적 행정처분 대상이 됩니다."}, {"title": "초기진압의 한계", "explanation": "초기진압은 의무가 아니라 훈련·장비·피난로가 갖춰진 작은 화재에서만 가능한 선택입니다.", "fieldPoint": "✓물질과 적합 소화약제가 확인되고 화재가 작고 통제 가능한지 판단합니다.", "details": ["✓물질과 적합 소화약제가 확인되고 화재가 작고 통제 가능한지 판단합니다.", "✓항상 등 뒤의 피난로를 확보하고 연기 속이나 막힌 공간으로 들어가지 않습니다.", "✓열·연기 증가, 폭발음, 용기 팽창·변형, 유독가스가 있으면 즉시 철수합니다.", "✓소화기 한 개로 통제되지 않거나 피난로가 위협받으면 전문대응팀에 인계합니다."], "checklist": ["초기진압의 한계 예방규정 준수 확인", "현장 보호구 및 점검표 확인", "비상연락망 및 롤콜 숙지"], "cautions": "초기진압의 한계 위반 시 ICDC 안전 규정 위반 및 법적 행정처분 대상이 됩니다."}, {"title": "소방대 정보인계", "explanation": "소방대가 실제 물질과 저장상태를 빨리 알수록 부적합한 소화와 2차 사고를 줄일 수 있습니다.", "fieldPoint": "✓위험물 목록, 저장실 배치, SDS, 최대수량과 실제 재고를 제공합니다.", "detail     function shuffleQuestion(question) {
      const pairs = question.options.map((opt, idx) => ({
        text: opt,
        isCorrect: idx === question.answer,
      }));
      for (let i = pairs.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
      }
      const newAnswer = pairs.findIndex(p => p.isCorrect);
      return {
        ...question,
        options: pairs.map(p => p.text),
        answer: newAnswer,
      };
    }

    // Pick 10 unique, non-duplicate questions
    function createRandomQuiz(courseId) {
      const bank = questionBankAll[courseId] || [];
      const selected = [];
      const seenIds = new Set();
      const seenQuestions = new Set();

      for (let unit = 0; unit < 10; unit++) {
        const pool = bank.filter(q => q.unit === unit && !seenQuestions.has(q.question));
        if (pool.length > 0) {
          const picked = pool[Math.floor(Math.random() * pool.length)];
          selected.push(picked);
          seenIds.add(picked.id);
          seenQuestions.add(picked.question);
        }
      }

      if (selected.length < 10) {
        const remaining = bank.filter(q => !seenIds.has(q.id) && !seenQuestions.has(q.question));
        while (selected.length < 10 && remaining.length > 0) {
          const idx = Math.floor(Math.random() * remaining.length);
          const picked = remaining.splice(idx, 1)[0];
          selected.push(picked);
          seenIds.add(picked.id);
          seenQuestions.add(picked.question);
        }
      }

      for (let i = selected.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [selected[i], selected[j]] = [selected[j], selected[i]];
      }

      return selected.map(q => shuffleQuestion(q));
    }

      const handleSubmit = (e) => {

              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>

                />
                {error && <span style={{ color: "#e11d48", fontSize: 12, fontWeight: 700, marginTop: 4 }}>관리자 번호가 일치하지 않습니다.</span>}

    }

    function parseDurationSeconds(durationStr) {
      if (!durationStr) return 120;
      let totalSec = 120;
      const minMatch = durationStr.match(/(\d+)\s*분/);
      const secMatch = durationStr.match(/(\d+)\s*초/);
      if (minMatch) {
        totalSec = parseInt(minMatch[1], 10) * 60;
        if (secMatch) totalSec += parseInt(secMatch[1], 10);
      } else if (secMatch) {
        totalSec = parseInt(secMatch[1], 10);
      }
      return Math.max(30, totalSec);
    }

    // ==================== DEDICATED FULLSCREEN COURSE VIEW (13-STEP E-BOOK) ====================
    function CourseView({ course, done, onBack, onComplete, onOpenCert }) {
      const units = trainingUnitsByCourse[course.id] ?? [];
      const basicTopics = basicTopicsByCourse[course.id] ?? [];
      
      const dualVideo = dualVideosByCourse?.[course.id] || {
        accident: accidentVideosByCourse[course.id],
        lecture: accidentVideosByCourse[course.id]
      };

      const [currentStep, setCurrentStep] = useState(0);
      const [combinedElapsed, setCombinedElapsed] = useState(0);
      const [watchedAll, setWatchedAll] = useState(false);
      const [quiz, setQuiz] = useState(() => createRandomQuiz(course.id));
      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);

      // Combined 90% duration calculation for BOTH videos together
      const accSec = useMemo(() => dualVideo?.accident?.durationSec || parseDurationSeconds(dualVideo?.accident?.duration), [dualVideo]);
      const lecSec = useMemo(() => dualVideo?.lecture?.durationSec || parseDurationSeconds(dualVideo?.lecture?.duration), [dualVideo]);
      const combinedTotalSec = accSec + lecSec;
      const combinedReq = useMemo(() => Math.max(15, Math.round(combinedTotalSec * 0.9)), [combinedTotalSec]);

      const allVideosWatched = watchedAll || done;

      // Single unified interval timer on step 08
      useEffect(() => {
        if (currentStep !== 7 || allVideosWatched) return;
        const timer = setInterval(() => {
          setCombinedElapsed(prev => {
            if (prev + 1 >= combinedReq) {
              return combinedReq;
            }
            return prev + 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [currentStep, combinedReq, allVideosWatched]);

      const isCombinedUnlocked = done || combinedElapsed >= combinedReq;

      const bankSize = (questionBankAll[course.id] || []).length;
      const score = quiz.reduce((sum, question) => sum + (answers[question.id] === question.answer ? 10 : 0), 0);
      const passed = submitted && score >= 80;

      const restartQuiz = () => {
        setQuiz(createRandomQuiz(course.id));
        setAnswers({});
        setSubmitted(false);
      };

      const stepTitles = [
        "01. 학습 목표",
        "02. 핵심 교육",
        "03. Basic 01",
        "04. Basic 02",
        "05. Basic 03",
        "06. Basic 04",
        "07. Basic 05",
        "08. 사고/강의영상",
        "09. 실무 1~5",
        "10. 실무 6~10",
        "11. 현장판단",
        "12. 과정평가",
        "13. 이수완료"
      ];

      const totalSteps = stepTitles.length;

      const canGoNext = () => {
        if (currentStep === 7 && !allVideosWatched) return false;
        if (currentStep === 11 && !passed && !done) return false;
        return currentStep < totalSteps - 1;
      };

      const handleNext = () => {
        if (canGoNext()) {
          setCurrentStep(prev => Math.min(prev + 1, totalSteps - 1));
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      };

      const handlePrev = () => {
        setCurrentStep(prev => Math.max(prev - 1, 0));
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const handlePassAndComplete = () => {
        onComplete();
        setCurrentStep(12);
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      return (
        <div className="course-view-page fade-in">
          {/* Top Bar with Return button */}
          <header className="course-nav-bar">
            <button className="back-home-btn" onClick={onBack}>
              <Icon name="back" size={16} /> 위험물 교육 포털 홈으로 돌아가기
            </button>
            <div className="course-top-title">
              <span className="slide-badge" style={{ background: "var(--tf-red)", color: "white", marginBottom: 0 }}>
                교육 {course.id} · {course.track}
              </span>
              <h2>{course.title}</h2>
            </div>
            <div>
              <span style={{ fontSize: 13, color: "#94a3b8" }}>{course.duration} 소요</span>
            </div>
          </header>

          {/* Stepper Tabs */}
          <nav className="course-stepper-bar" aria-label="학습 목차">
            {stepTitles.map((title, idx) => {
              const isActive = currentStep === idx;
              const isPassed = currentStep > idx || done;
              return (
                <button
                  key={idx}
                  className={`step-tab-btn ${isActive ? "active" : ""} ${isPassed ? "completed" : ""}`}
                  onClick={() => {
                    if (done || idx <= currentStep || (idx === 8 && allVideosWatched)) {
                      setCurrentStep(idx);
                      window.scrollTo({ top: 0, behavior: "smooth" });
                    }
                  }}
                >
                  <span className="num">{idx + 1}</span>
                  <span>{title}</span>
                </button>
              );
            })}
          </nav>

          {/* Main Slide Content */}
          <main className="course-main-content">
            {currentStep === 0 && (
              <section className="book-slide fade-in">
                <div className="book-slide-header">
                  <span className="slide-badge">STEP 01 · 과정 개요 & 학습 목표</span>
                  <h2>{course.title}</h2>
                  <p className="slide-sub">{course.subtitle}</p>
                </div>

                <div className="objective-grid">
                  {course.objectives.map((obj, i) => (
                    <div key={i} className="objective-card">
                      <span className="obj-num">{i + 1}</span>
                      <p>{obj}</p>
                    </div>
                  ))}
                </div>

                <div style={{ padding: "20px 24px", background: "#ffffff", border: "1px solid var(--line)", borderRadius: 8, display: "flex", alignItems: "center", gap: 16 }}>
                  <Icon name="book" size={24} />
                  <div>
                    <strong style={{ display: "block", fontSize: 15, color: "#0f172a" }}>전자책(E-Book) 슬라이드 학습 안내</strong>
                    <p style={{ margin: 0, fontSize: 13.5, color: "#64748b" }}>
                      상단 단계 탭 또는 하단 <strong>[다음 쪽 →]</strong> 버튼을 눌러 Basic 기초이론, 사고/강의영상(2종 필수), 실무단원, 최종평가 순으로 학습하세요.
                    </p>
                  </div>
                </div>
              </section>
            )}

            {currentStep === 1 && (
              <section className="book-slide fade-in">
                <div className="book-slide-header">
                  <span className="slide-badge">STEP 02 · 핵심 교육 내용 (3대 기둥)</span>
                  <h2>현장 안전을 지탱하는 3가지 필수 축</h2>
                  <p className="slide-sub">모든 안전 조치는 법적 근거와 현장 확인, 비상 대응의 3단계로 이어집니다.</p>
                </div>
                <div className="core-slide-grid">
                  {course.core.map((item, idx) => (
                    <article key={idx} className="core-slide-card">
                      <div className="core-card-head">
                        <strong>PILLAR 0{idx + 1}</strong>
                        <h3>{item.title}</h3>
                      </div>
                      <p>{item.body}</p>
                    </article>
                  ))}
                </div>
              </section>
            )}

            {currentStep >= 2 && currentStep <= 6 && (() => {
              const bIdx = currentStep - 2;
              const item = basicTopics[bIdx] || { title: `기본수칙 0${bIdx + 1}`, explanation: "현장 안전 기준을 준수합니다.", fieldPoint: "사전 점검 철저", details: ["규정 준수"], checklist: ["점검표 확인"], cautions: "주의" };
              return (
                <section className="book-slide fade-in" key={currentStep}>
                  <div className="book-slide-header">
                    <span className="slide-badge basic-badge">STEP 0{currentStep + 1} · 기본교육 BASIC 0{bIdx + 1}</span>
                    <h2>{item.title}</h2>
                    <p className="slide-sub">{item.explanation}</p>
                  </div>

                  <div className="basic-book-card">
                    <div className="basic-book-field">
                      <b>📌 현장 핵심 포인트</b>
                      <p>{item.fieldPoint}</p>
                    </div>

                    <div className="basic-book-grid-2col">
                      <div className="basic-deep-dive">
                        <h5>📖 법적·기술적 상세 해설</h5>
                        <ul>
                          {(item.details || [item.explanation]).map((det, dIdx) => (
                            <li key={dIdx}>{det}</li>
                          ))}
                        </ul>
                      </div>

                      <div className="basic-right-col">
                        <div className="basic-checklist-box">
                          <h5>✅ 작업 전 현장 점검 항목</h5>
                          <div className="basic-checks">
                            {(item.checklist || ["작업 전 점검"]).map((chk, cIdx) => (
                              <label key={cIdx}>
                                <input type="checkbox" defaultChecked />
                                <span>{chk}</span>
                              </label>
                            ))}
                          </div>
                        </div>

                        <div className="basic-caution-alert">
                          <b>⚠️ 위반 시 위험 및 법적 행정처분</b>
                          <p>{item.cautions || "사고 위험이 있습니다."}</p>
                        </div>
                      </div>
                    </div>
                  </div>
                </section>
              );
            })()}

            {/* STEP 08: SIMULTANEOUS DUAL VIDEOS (NO TAB SWITCHING) WITH COMBINED 90% DURATION GATE */}
            {currentStep === 7 && (
              <section className="book-slide fade-in">
                <div className="book-slide-header">
                  <div className="video-header-badges">
                    <span className="slide-badge video-badge">STEP 08 · 필수 시청 교육영상 (2종 동시 탑재)</span>
                    <span className="video-duration-badge">⏱ 2종 합산 90% 시청 인증</span>
                  </div>
                  <h2>[교육 {course.id}] {course.id <= 12 ? "사고사례 분석 및 실무 핵심 강의 (2종 필수 시청)" : "실무 안전교육 및 핵심 해설 강의 (2종 필수 시청)"}</h2>

                  </p>
                </div>

                {/* 2-Column Simultaneous Video Grid */}

                  {/* Video 1: Accident / Safety Practice Video Card */}

                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <span style={{ fontSize: 16 }}>{course.id <= 12 ? "🚨" : "🛡️"}</span>
                        <h3>{course.id <= 12 ? "[1/2] 실제 사고사례 뉴스·감식 영상" : "[1/2] 실무 안전수칙 및 현장 교육 영상"}</h3>
                      </div>
                      <span style={{ fontSize: 12, background: "rgba(255,255,255,0.2)", padding: "3px 8px", borderRadius: 4 }}>
                        {dualVideo.accident.duration}
                      </span>
                    </div>

                    <div className="video-player-box">
                      <div className="video-frame">
                        <iframe
                          src={`https://www.youtube.com/embed/${dualVideo.accident.youtubeId}?rel=0`}
                          title={dualVideo.accident.title}
                          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                          allowFullScreen
                        />
                      </div>
                      <div className="video-direct-bar">
                        <span style={{ fontSize: 11.5, color: "#94a3b8" }}>화면 오류 시:</span>
                        <a href={dualVideo.accident.url} target="_blank" rel="noreferrer" className="video-direct-link">
                          📺 공식 채널에서 직접 시청 ↗
                        </a>
                      </div>
                    </div>

                    <div className="dual-video-info-box">
                      <strong style={{ fontSize: 14.5, color: "#0f172a", lineHeight: 1.4 }}>{dualVideo.accident.title}</strong>
                      <p className="video-summary-text">{dualVideo.accident.summary}</p>
                      <div className="learning-points-box">
                        <h4>🎯 {course.id <= 12 ? "사고사례 핵심 교훈 3가지" : "실무 안전수칙 핵심 요점 3가지"}</h4>
                        <ul>
                          {dualVideo.accident.learningPoints.map((point, pIdx) => (
                            <li key={pIdx}>{point}</li>
                          ))}
                        </ul>
                      </div>
                    </div>
                  </div>

                  {/* Video 2: Lecture Video Card */}
                  <div className="dual-video-card">
                    <div className="dual-video-card-header lecture">
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <span style={{ fontSize: 16 }}>📺</span>
                        <h3>[2/2] 법령·실무 핵심 해설 강의</h3>
                      </div>
                      <span style={{ fontSize: 12, background: "rgba(255,255,255,0.2)", padding: "3px 8px", borderRadius: 4 }}>
                        {dualVideo.lecture.duration}
                      </span>
                    </div>

                    <div className="video-player-box">
                      <div className="video-frame">
                        <iframe
                          src={`https://www.youtube.com/embed/${dualVideo.lecture.youtubeId}?rel=0`}
                          title={dualVideo.lecture.title}
                          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                          allowFullScreen
                        />
                      </div>
                      <div className="video-direct-bar">
                        <span style={{ fontSize: 11.5, color: "#94a3b8" }}>화면 오류 시:</span>
                        <a href={dualVideo.lecture.url} target="_blank" rel="noreferrer" className="video-direct-link">
                          📺 공식 채널에서 직접 시청 ↗
                        </a>
                      </div>
                    </div>

                    <div className="dual-video-info-box">
                      <strong style={{ fontSize: 14.5, color: "#0f172a", lineHeight: 1.4 }}>{dualVideo.lecture.title}</strong>
                      <p className="video-summary-text">{dualVideo.lecture.summary}</p>
                      <div className="learning-points-box">
                        <h4>🎯 실무 강의 핵심 요점 3가지</h4>
                        <ul>
                          {dualVideo.lecture.learningPoints.map((point, pIdx) => (
                            <li key={pIdx}>{point}</li>
                          ))}
                        </ul>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Combined Total 90% Duration Action Bar */}
                <div className="combined-video-action-bar">
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 10 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <span style={{ fontSize: 22 }}>{allVideosWatched ? "🎉" : "⏱️"}</span>
                      <div>
                        <strong style={{ fontSize: 15, color: allVideosWatched ? "#166534" : "#0f172a" }}>
                          {allVideosWatched ? "2종 영상 수강 완료 (합산 90% 이상 인증)" : "2종 영상 필수 시청 진행 현황"}
                        </strong>
                        <span style={{ display: "block", fontSize: 12.5, color: "#64748b", marginTop: 2 }}>
                          1번 {course.id <= 12 ? "사고영상" : "교육영상"} ({dualVideo.accident.duration}) + 2번 강의영상 ({dualVideo.lecture.duration}) = 총 {Math.floor(combinedTotalSec / 60) > 0 ? Math.floor(combinedTotalSec / 60) + "분 " : ""}{combinedTotalSec % 60}초 | 90% 필수 시청: {combinedReq}초
                        </span>
                      </div>
                    </div>

                    <div style={{ textAlign: "right" }}>
                      <span style={{ fontSize: 14, fontWeight: 800, color: allVideosWatched ? "#16a34a" : isCombinedUnlocked ? "#16a34a" : "#ea580c" }}>
                        {allVideosWatched ? "✓ 확인 완료" : isCombinedUnlocked ? "시청 완료 (확인 가능)" : `${combinedReq - combinedElapsed}초 후 활성화 (${Math.round((combinedElapsed / combinedReq) * 100)}%)`}
                      </span>
                    </div>
                  </div>

                  {!allVideosWatched && (
                    <div style={{ height: 8, background: "#e2e8f0", borderRadius: 4, overflow: "hidden" }}>
                      <div style={{ height: "100%", width: `${Math.min(100, Math.round((combinedElapsed / combinedReq) * 100))}%`, background: isCombinedUnlocked ? "#16a34a" : "#ea580c", transition: "width 1s linear" }} />
                    </div>
                  )}

                  <div>
                    {allVideosWatched ? (
                      <div className="video-confirmed-tag">
                        <Icon name="check" size={20} /> 🎉 2종 영상({course.id <= 12 ? "사고사례 및 핵심강의" : "예방수칙 및 핵심강의"}) 시청 확인 완료 (다음 단계 '실무단원'으로 이동 가능)
                      </div>
                    ) : !isCombinedUnlocked ? (
                      <button
                        className="confirm-watch-button"
                        disabled
                        style={{ background: "#cbd5e1", color: "#64748b", cursor: "not-allowed", border: "1.5px solid #94a3b8" }}
                      >
                        ⏱ 2종 영상 총 시간의 90% 이상 시청 후 확인 버튼이 열립니다 ({Math.max(0, combinedReq - combinedElapsed)}초 남음)
                      </button>
                    ) : (
                      <button
                        className="confirm-watch-button"
                        onClick={() => setWatchedAll(true)}
                        style={{ background: "var(--orange)" }}
                      >
                        <Icon name="check" size={20} /> [완료 확인] 2종 영상({course.id <= 12 ? "사고사례 및 핵심강의" : "예방수칙 및 핵심강의"}) 시청 완료 확인 (합산 90% 이상 시청 달성)
                      </button>
                    )}
                  </div>
                </div>
              </section>
            )}

            {currentStep === 8 && (
              <section className="book-slide fade-in">
                <div className="book-slide-header">
                  <span className="slide-badge">STEP 09 · 실무 10대 단원 (1~5단원)</span>
                  <h2>상황별 필수 안전조치 vs 위험 행동 비교</h2>
                  <p className="slide-sub">각 실무 상황별로 작업자가 취해야 할 올바른 조치와 그 이유를 숙지하세요.</p>
                </div>
                <div className="training-units-list">
                  {units.slice(0, 5).map((unit, idx) => (
                    <article key={idx} className="training-unit-card">
                      <header className="unit-header">
                        <span className="unit-tag">단원 0{idx + 1}</span>
                        <h3>{unit.topic}</h3>
                      </header>
                      <div className="unit-context-box">
                        <b>🚨 현장 상황:</b> {unit.context}
                      </div>
                      <div className="unit-action-grid">
                        <div className="safe-action">
                          <b>✅ 필수 안전 조치</b>
                          <p>{unit.safeAction}</p>
                        </div>
                        <div className="unsafe-action">
                          <b>❌ 절대 피해야 할 행동</b>
                          <p>{unit.unsafeAction}</p>
                        </div>
                      </div>
                      <div className="unit-reason">
                        <b>💡 이유 및 법적 근거:</b> {unit.reason}
                      </div>
                    </article>
                  ))}
                </div>
              </section>
            )}

            {currentStep === 9 && (
              <section className="book-slide fade-in">
                <div className="book-slide-header">
                  <span className="slide-badge">STEP 10 · 실무 10대 단원 (6~10단원)</span>
                  <h2>심화 관리 및 비상 대응 실무 지침</h2>
                  <p className="slide-sub">지정수량 관리, 소방 설비, 비상 보고 및 대피 절차를 확인합니다.</p>
                </div>
                <div className="training-units-list">
                  {units.slice(5, 10).map((unit, idx) => (
                    <article key={idx} className="training-unit-card">
                      <header className="unit-header">
                        <span className="unit-tag">단원 {idx + 6 >= 10 ? idx + 6 : "0" + (idx + 6)}</span>
                        <h3>{unit.topic}</h3>
                      </header>
                      <div className="unit-context-box">
                        <b>🚨 현장 상황:</b> {unit.context}
                      </div>
                      <div className="unit-action-grid">
                        <div className="safe-action">
                          <b>✅ 필수 안전 조치</b>
                          <p>{unit.safeAction}</p>
                        </div>
                        <div className="unsafe-action">
                          <b>❌ 절대 피해야 할 행동</b>
                          <p>{unit.unsafeAction}</p>
                        </div>
                      </div>
                      <div className="unit-reason">
                        <b>💡 이유 및 법적 근거:</b> {unit.reason}
                      </div>
                    </article>
                  ))}
                </div>
              </section>
            )}

            {currentStep === 10 && (
              <section className="book-slide fade-in">
                <div className="book-slide-header">
                  <span className="slide-badge">STEP 11 · 현장 판단 훈련 & 5점 점검</span>
                  <h2>돌발 상황 시나리오 및 작업 전 점검표</h2>
                  <p className="slide-sub">비정상 상태 발생 시의 현장 대응 흐름과 5대 필수 점검 항목을 확인합니다.</p>
                </div>

                <div style={{ padding: 24, background: "#fff7ed", borderLeft: "6px solid #ea580c", borderRadius: 8, marginBottom: 24 }}>
                  <h3 style={{ margin: "0 0 10px", fontSize: 18, color: "#c2410c", fontWeight: 900 }}>대표 시나리오 판단 훈련</h3>
                  <p style={{ margin: "0 0 8px", fontSize: 15, color: "#0f172a" }}><strong>상황:</strong> {course.scenario.situation}</p>
                  <p style={{ margin: 0, fontSize: 15, color: "#0f172a" }}><strong>권장 조치:</strong> {course.scenario.action}</p>
                </div>

                <div style={{ padding: 24, background: "#ffffff", border: "1px solid var(--line)", borderRadius: 8 }}>
                  <h3 style={{ margin: "0 0 16px", fontSize: 18, fontWeight: 900 }}>작업 전 5점 필수 확인표</h3>
                  <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))", gap: 12 }}>
                    {course.checklist.map((item, idx) => (
                      <label key={idx} style={{ padding: 14, background: "#f8fafc", border: "1px solid #cbd5e1", borderRadius: 6, display: "flex", alignItems: "flex-start", gap: 10, cursor: "pointer" }}>
                        <input type="checkbox" defaultChecked style={{ marginTop: 3 }} />
                        <span style={{ fontSize: 13.5, color: "#0f172a", fontWeight: 600 }}>{item}</span>
                      </label>
                    ))}
                  </div>
                </div>
              </section>
            )}

            {/* STEP 12: 10 UNIQUE QUESTIONS WITH NO DUPLICATES */}
            {currentStep === 11 && (
              <section className="book-slide fade-in">
                <div className="book-slide-header">
                  <div className="video-header-badges">
                    <span className="slide-badge exam-badge">STEP 12 · 과정 최종 평가 (10문항)</span>
                    <span className="video-duration-badge" style={{ background: "#e0f2fe", borderColor: "#7dd3fc", color: "#0369a1" }}>
                      🎲 10문항 전원 상이 출제 & 보기 무작위 셔플
                    </span>
                  </div>
                  <h2>실전 현장판단 평가</h2>
                  <p className="slide-sub">10문항 중 8문항(80점) 이상 맞추셔야 본 과정 이수가 완료됩니다.</p>
                </div>

                <div className="exam-status-bar">
                  <div style={{ fontSize: 15, fontWeight: 800 }}>
                    응시 현황: {Object.keys(answers).length} / 10문항 완료
                  </div>
                  {submitted && (
                    <div className={`course-score ${passed ? "pass" : ""}`}>
                      <span style={{ fontSize: 12, fontWeight: 800, color: "#64748b" }}>최종 점수: </span>
                      <strong>{score}점</strong>
                      <span style={{ marginLeft: 12, fontWeight: 700 }}>
                        {passed ? "🎉 합격하셨습니다!" : "⚠️ 80점 미만입니다. 다시 응시해 주세요."}
                      </span>
                    </div>
                  )}
                </div>

                <div className="course-quiz-list">
                  {quiz.map((q, qIndex) => {
                    const selected = answers[q.id];
                    const isCorrect = selected === q.answer;
                    return (
                      <article key={q.id} className="course-quiz-item">
                        <div className="course-quiz-top">
                          <span>문항 0{qIndex + 1}</span>
                          <small>{q.tag}</small>
                        </div>
                        <h4>{q.question}</h4>
                        <div className="course-quiz-options">
                          {q.options.map((opt, optIndex) => {
                            const isChecked = selected === optIndex;
                            let statusClass = "";
                            if (submitted) {
                              if (optIndex === q.answer) statusClass = "correct";
                              else if (isChecked) statusClass = "wrong";
                            }
                            return (
                              <label key={optIndex} className={`${statusClass}`}>
                                <input
                                  type="radio"
                                  name={`quiz-${q.id}`}
                                  checked={isChecked}
                                  onChange={() => !submitted && setAnswers(prev => ({ ...prev, [q.id]: optIndex }))}
                                />
                                <span>{optIndex + 1}</span>
                                <p>{opt}</p>
                              </label>
                            );
                          })}
                        </div>
                        {submitted && (
                          <div className={`course-rationale ${isCorrect ? "correct" : "wrong"}`}>
                            <b>{isCorrect ? "정답 해설" : "오답 해설"}</b>
                            <p>{q.rationale}</p>
                          </div>
                        )}
                      </article>
                    );
                  })}
                </div>

                <div className="exam-submit">
                  <p style={{ margin: 0, fontSize: 14.5, color: "#475569" }}>10문항을 모두 선택하신 후 채점 버튼을 누르세요.</p>
                  <div style={{ display: "flex", gap: 10 }}>
                    {!submitted ? (
                      <button
                        className="admin-action-btn"
                        style={{ background: Object.keys(answers).length === 10 ? "var(--tf-red)" : "#cbd5e1", color: "white", padding: "12px 28px", fontSize: 15 }}
                        disabled={Object.keys(answers).length < 10}
                        onClick={() => setSubmitted(true)}
                      >
                        시험 채점하기 →
                      </button>
                    ) : (
                      <>
                        <button className="admin-action-btn" style={{ background: "#e2e8f0" }} onClick={restartQuiz}>새 문제 10개 풀기</button>
                        {passed && (
                          <button className="admin-action-btn" style={{ background: "#16a34a", color: "white", padding: "12px 28px", fontSize: 15 }} onClick={handlePassAndComplete}>
                            <Icon name="check" size={16} /> 이수 완료하고 수료증 발급하기 →
                          </button>
                        )}
                      </>
                    )}
                  </div>
                </div>
              </section>
            )}

            {currentStep === 12 && (
              <section className="book-slide fade-in completion-slide">
                <div className="completion-card">
                  <div className="completion-icon"><Icon name="check" size={48} /></div>
                  <h2>교육 {course.id} 이수를 축하합니다!</h2>
                  <p style={{ margin: "0 0 24px", color: "#475569", fontSize: 15 }}>
                    <strong>[{course.title}]</strong>의 모든 학습과 평가(최종 {score}점)를 완벽하게 마쳤습니다.
                  </p>
                  
                  <div className="completion-stats">
                    <div><span>학습 과정</span><b>교육 {course.id}</b></div>
                    <div><span>평가 결과</span><strong style={{ color: "#16a34a", fontSize: 24 }}>{score}점</strong></div>
                    <div><span>이수 상태</span><b style={{ color: "#16a34a" }}>이수 완료 (Pass)</b></div>
                  </div>

                  <div className="completion-actions">
                    <button className="admin-action-btn" style={{ background: "#e2e8f0" }} onClick={onBack}>교육 포털 홈으로 돌아가기</button>
                    <button className="admin-action-btn" style={{ background: "var(--tf-red)", color: "white", padding: "12px 28px" }} onClick={() => onOpenCert(course, false)}>
                      <Icon name="cert" size={18} /> 한국피셔과학(주) 공식 수료증 발급하기 ↗
                    </button>
                  </div>
                </div>
              </section>
            )}
          </main>

          {/* Bottom Fixed Navigation Bar */}
          <footer className="bottom-course-bar">
            <button
              className="bottom-nav-btn"
              disabled={currentStep === 0}
              onClick={handlePrev}
            >
              ← 이전 쪽
            </button>

            <div style={{ textAlign: "center" }}>
              <strong style={{ fontSize: 15, color: "#0f172a", display: "block" }}>{stepTitles[currentStep]}</strong>
              <span style={{ fontSize: 12, color: "#64748b" }}>{currentStep + 1} / {totalSteps} 쪽</span>
            </div>

            <button
              className={`bottom-nav-btn next ${canGoNext() ? "highlight" : ""}`}
              disabled={!canGoNext()}
              onClick={handleNext}
            >
              다음 쪽 →
            </button>
          </footer>
        </div>
      );
    }

    // ==================== PORTAL HOME VIEW (EXACT SCREENSHOT LAYOUT) ====================
    function PortalHome({ onSelectCourse, completed, adminMode, onOpenAdmin, onLogoutAdmin, onOpenCert }) {
      const [track, setTrack] = useState("전체 36개");
      const [search, setSearch] = useState("");

      // Active Course for Current Month (Calculated based on Current System Date in 3-year recurring cycle)
      // Anchor: 2026년 8월 -> Course 12 (12th course)
      const currentActiveCourseId = useMemo(() => {
        const now = new Date();
        const curYear = now.getFullYear();
        const curMonth = now.getMonth() + 1; // 1..12
        const monthDiff = (curYear - 2026) * 12 + (curMonth - 8);
        let activeIdx = (11 + monthDiff) % 36;
        if (activeIdx < 0) activeIdx += 36;
        return activeIdx + 1; // 1..36
      }, []);

      const isCourseUnlocked = (course) => {
        if (adminMode) return true;
        // Strict monthly single-course rule: ONLY the active course of current month is open!
        return course.id === currentActiveCourseId;
      };

      const filteredCourses = useMemo(() => {
        return courses.filter(c => {
          let matchesTrack = true;
          if (track === "1차: 기본 교육 (01~12)") {
            matchesTrack = c.id <= 12;
          } else if (track === "2차: 실무 해설서 (13~24)") {
            matchesTrack = c.id >= 13 && c.id <= 24;
          } else if (track === "3차: ICDC 실무 (25~36)") {
            matchesTrack = c.id >= 25;
          } else if (track !== "전체 36개") {
            matchesTrack = c.track === track;
          }
          const matchesSearch = c.title.toLowerCase().includes(search.toLowerCase()) || c.subtitle.toLowerCase().includes(search.toLowerCase());
          return matchesTrack && matchesSearch;
        });
      }, [track, search]);

      return (
        <div>
          {/* Thermo Fisher Scientific Brand Hero matching Screenshot */}
          <header className="portal-hero">
            <div className="tf-logo-area">
              <img
                src={LOGO_SRC}
                alt="Thermo Fisher Scientific"
              />
            </div>
            <h1 className="portal-title">위험물 안전관리 교육 포털</h1>
            <p className="portal-sub">
              안전은 우리 모두의 책임입니다. 이번 달(2026년 8월)은 <strong>[교육 12]</strong> 과정이 수강 진행 중이며, 매월 1일 다음 회차가 순차적으로 자동 오픈됩니다.
            </p>
          </header>

          <main className="portal-container">
            {/* 3 Info Badges Grid */}
            <div className="info-badges-grid">
              <div className="info-badge-card">
                <small>교육 대상</small>
                <strong>위험물 취급자·협력업체</strong>
              </div>
              <div className="info-badge-card">
                <small>교육 증빙</small>
                <strong>참석자·사진·평가·개선사항</strong>
              </div>
              <div className="info-badge-card">
                <small>평가 기준</small>
                <strong>10문항 · 80점 이상</strong>
              </div>
            </div>

            {/* ICDC Regulation Box matching Screenshot */}
            <section className="regulation-box">
              <div className="regulation-head">
                <div>
                  <h3>예방규정 반영 현황</h3>
                  <p>한국피셔과학(주) 인천 ICDC의 위험물 옥내저장소 예방규정을 교육 기준으로 반영했습니다.</p>
                </div>
                <a href="https://hazmat.nfa.go.kr/" target="_blank" rel="noreferrer" className="reg-link-btn">
                  국가위험물정보 확인 ↗
                </a>
              </div>

              <div className="reg-fields-grid">
                <div className="reg-field-item">
                  <small>시설</small>
                  <strong>위험물 옥내저장소</strong>
                </div>
                <div className="reg-field-item">
                  <small>허가번호</small>
                  <strong>21-0108-140324호</strong>
                </div>
                <div className="reg-field-item">
                  <small>비상대피 기준 인원</small>
                  <strong>23명 · 3개 대피동선</strong>
                </div>
                <div className="reg-field-item">
                  <small>교육 대상</small>
                  <strong>전 종사자·협력업체·출입자</strong>
                </div>
              </div>

              <p className="reg-note-text">
                교육 전 최신 위험물 목록·SDS·비상연락망·대피도·소화설비 배치도를 반드시 재확인하세요. 예방규정의 교육기록 보존기간은 조항별 2년/3년 표기가 달라, 사내 문서관리 기준을 3년 이상으로 통일할지 승인권자가 확인해야 합니다.
              </p>
            </section>

            {/* Admin Preview Banner matching Screenshot */}
            <div className="admin-banner">
              <div className="admin-banner-left">
                <h4>관리자 과정 미리보기</h4>
                <p>관리자 번호를 인증하면 순차 오픈 예정 및 지난 회차를 포함한 <strong>전체 36개 과정</strong>을 자유롭게 검토하고 수료증을 발급할 수 있습니다.</p>
                {adminMode && <div className="status-text">✓ 잠김·종료 과정을 포함한 전체 36개 교육이 열렸습니다.</div>}
              </div>
              <div className="admin-banner-right">
                {adminMode ? (
                  <>
                    <span className="admin-active-badge">🔑 관리자 모드 사용 중</span>
                    <button className="admin-action-btn" style={{ background: "#ea580c", color: "white" }} onClick={() => onOpenCert(null, true)}>
                      <Icon name="cert" size={14} /> 관리자 수료증 발급기
                    </button>
                    <button className="admin-action-btn" onClick={onLogoutAdmin}>미리보기 종료</button>
                  </>
                ) : (
                  <>
                    <button className="admin-action-btn" onClick={onOpenAdmin}>🔑 관리자 번호 인증</button>
                    <button className="admin-action-btn" style={{ background: "transparent", border: "1px solid rgba(255,255,255,.4)", color: "white" }} onClick={() => onOpenCert(null, true)}>
                      <Icon name="key" size={13} /> 관리자 발급기
                    </button>
                  </>
                )}
              </div>
            </div>

            {/* Curriculum Section */}
            <section id="curriculum">
              <div className="section-kicker">TRAINING COURSES</div>
              <div className="section-main-title">
                <span>교육 과정 ({filteredCourses.length}개)</span>
                <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
                  <input
                    type="text"
                    placeholder="과정명 검색..."
                    value={search}
                    onChange={e => setSearch(e.target.value)}
                    style={{ padding: "8px 16px", border: "1.5px solid #cbd5e1", borderRadius: 8, fontSize: 13.5 }}
                  />
                  <button className="admin-action-btn" style={{ background: "#0f2335", color: "white" }} onClick={() => onOpenCert(null, adminMode)}>
                    <Icon name="cert" size={15} /> 이수 확인증 발급
                  </button>
                  {adminMode && (
                    <button className="admin-action-btn" style={{ background: "var(--tf-red)", color: "white" }} onClick={() => onOpenCert(null, true)}>
                      🔑 관리자 수료증 발급기
                    </button>
                  )}
                </div>
              </div>

              {/* Track Filters */}
              <div className="track-filter-row">
                {tracks.map(t => (
                  <button
                    key={t}
                    className={`track-chip ${track === t ? "active" : ""}`}
                    onClick={() => setTrack(t)}
                  >
                    {t}
                  </button>
                ))}
              </div>

              {/* Clean White Course Grid matching Screenshot */}
              <div className="course-grid">
                {filteredCourses.map(course => {
                  const isDone = completed.includes(course.id);
                  const unlocked = isCourseUnlocked(course);
                  const isCurrentMonth = (course.id === currentActiveCourseId);
                  const colorClass = badgeColors[(course.id - 1) % badgeColors.length];

                  return (
                    <article
                      key={course.id}
                      className={`clean-course-card ${!unlocked ? "is-locked" : ""} ${isDone ? "is-done" : ""} ${isCurrentMonth ? "current-active-card" : ""}`}
                      style={isCurrentMonth ? { border: "2px solid #16a34a", boxShadow: "0 4px 16px rgba(22, 163, 74, 0.15)" } : {}}
                      onClick={() => {
                        if (unlocked) {
                          onSelectCourse(course);
                        } else {
                          onOpenAdmin();
                        }
                      }}
                    >
                      <div className="course-card-top">
                        <span className={`course-badge-pill ${colorClass}`}>
                          교육 {course.id}
                        </span>
                        <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                          {course.id >= 25 && <span className="status-badge" style={{ background: "#e0f2fe", color: "#0369a1" }}>ICDC 실무</span>}
                          {isCurrentMonth ? (
                            <span className="status-badge open" style={{ background: "#dcfce7", color: "#15803d", fontWeight: 800, border: "1px solid #86efac" }}>
                              ✨ 이번 달 교육 (학습 가능)
                            </span>
                          ) : !unlocked ? (
                            <span className="status-badge lock"><Icon name="lock" size={12} /> {course.unlockDate} 오픈</span>
                          ) : isDone ? (
                            <span className="status-badge done"><Icon name="check" size={12} /> 이수 완료</span>
                          ) : (
                            <span className="status-badge open">학습 가능</span>
                          )}
                        </div>
                      </div>

                      <h3>{course.title}</h3>
                      <p>{course.subtitle}</p>

                      <div className="course-card-footer">
                        <div className="course-meta-tags">
                          <span>⏱ {course.duration}</span>
                          <span>🎯 {course.level}</span>
                          <span>📚 {course.source}</span>
                        </div>
                        <button
                          type="button"
                          className={`course-action-btn ${!unlocked ? "locked" : ""}`}
                          style={isCurrentMonth ? { background: "#16a34a", color: "white" } : {}}
                          onClick={(e) => {
                            e.stopPropagation();
                            if (unlocked) {
                              onSelectCourse(course);
                            } else {
                              onOpenAdmin();
                            }
                          }}
                        >
                          {isCurrentMonth ? "이번 달 학습 시작하기 →" : !unlocked ? `🔒 ${course.unlockDate} 오픈` : isDone ? "다시 학습하기 →" : "학습 시작 →"}
                        </button>
                      </div>
                    </article>
                  );
                })}
              </div>
            </section>
          </main>

          <footer style={{ background: "#ffffff", borderTop: "1px solid var(--line)", padding: "32px 24px", textAlign: "center", color: "#64748b", fontSize: 13 }}>
            <div style={{ maxWidth: 1280, margin: "0 auto", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 14 }}>
              <div>
                <strong style={{ color: "#0f172a" }}>한국피셔과학(주) 인천 ICDC 위험물 안전관리 교육 포털</strong>
                <p style={{ margin: "4px 0 0" }}>위험물안전관리법 제17조 및 인천 ICDC 옥내저장소 예방규정 준수 (총 36개 실무 교육과정)</p>
              </div>
              <div style={{ display: "flex", gap: 10 }}>
                <button className="admin-action-btn" style={{ background: "#0f2335", color: "white" }} onClick={() => onOpenCert(null, adminMode)}>
                  <Icon name="cert" size={15} /> 이수 확인증 발급기
                </button>
                <button className="admin-action-btn" style={{ background: "var(--tf-red)", color: "white" }} onClick={() => onOpenCert(null, true)}>
                  🔑 관리자 발급기
                </button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // ==================== ROOT APP COMPONENT ====================
    function App() {
      const [selectedCourse, setSelectedCourse] = useState(null);
      const [certTargetCourse, setCertTargetCourse] = useState(null);
      const [certIsAdmin, setCertIsAdmin] = useState(false);
      const [pendingAdminCert, setPendingAdminCert] = useState(false);

      const [completed, setCompleted] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem("completed_courses_v8") || "[]");
        } catch {
          return [];
        }
      });
      const [adminMode, setAdminMode] = useState(() => {
        return sessionStorage.getItem("admin_preview_active") === "true";
      });
      const [showAdminModal, setShowAdminModal] = useState(false);
      const [showCertModal, setShowCertModal] = useState(false);

      useEffect(() => {
        try {
          localStorage.setItem("completed_courses_v8", JSON.stringify(completed));
        } catch (e) {}
      }, [completed]);

      const handleCompleteCourse = (courseId) => {
        setCompleted(prev => prev.includes(courseId) ? prev : [...prev, courseId]);
      };

      const handleAdminAuth = () => {
        setAdminMode(true);
        sessionStorage.setItem("admin_preview_active", "true");
        if (pendingAdminCert) {
          setCertIsAdmin(true);
          setShowCertModal(true);
          setPendingAdminCert(false);
        }
      };

      const handleAdminLogout = () => {
        setAdminMode(false);
        sessionStorage.removeItem("admin_preview_active");
        setCertIsAdmin(false);
      };

      const handleOpenCert = (course, asAdmin = false) => {
        if (asAdmin && !adminMode) {
          // Strictly require admin password verification first!
          setPendingAdminCert(true);
          setCertTargetCourse(course || null);
          setShowAdminModal(true);
          return;
        }
        setCertTargetCourse(course || null);
        setCertIsAdmin(adminMode);
        setShowCertModal(true);
      };

      return (
        <div>
          {selectedCourse ? (
            <CourseView
              course={selectedCourse}
              done={completed.includes(selectedCourse.id)}
              onBack={() => {
                setSelectedCourse(null);
                window.scrollTo({ top: 0, behavior: "smooth" });
              }}
              onComplete={() => handleCompleteCourse(selectedCourse.id)}
              onOpenCert={handleOpenCert}
            />
          ) : (
            <PortalHome
              onSelectCourse={(c) => {
                setSelectedCourse(c);
                window.scrollTo({ top: 0, behavior: "smooth" });
              }}
              completed={completed}
              adminMode={adminMode}
              onOpenAdmin={() => setShowAdminModal(true)}
              onLogoutAdmin={handleAdminLogout}
              onOpenCert={handleOpenCert}
            />
          )}

          {showAdminModal && (
            <AdminModal
              onClose={() => setShowAdminModal(false)}
              onAuthSuccess={handleAdminAuth}
            />
          )}

          {showCertModal && (
            <CertificateModal
              fixedCourse={certTargetCourse}
              courses={courses}
              completedCourses={completed}
              isAdminInitial={certIsAdmin}
              onClose={() => {
                setShowCertModal(false);
                setCertTargetCourse(null);
              }}
            />
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById("root"));
  </script>
</body>
</html>
